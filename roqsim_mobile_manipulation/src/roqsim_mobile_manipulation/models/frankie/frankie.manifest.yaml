# Default controllers shipped with the Frankie mobile manipulator (Panda on an Omron LD-60 base).
#
# `spawn_robot: {model: frankie}` pulls these in automatically, so a world does not re-declare the
# robot's intrinsic drive/arm controllers. To override a default, declare the same plugin for the same
# robot in the world (it wins, and its config merges over the manifest's); to opt out entirely, set
# `spawn_robot` config `default_plugins: false`. Each entry's `robot` is filled in from the spawn name.
#
# Frankie is a wheeled mobile manipulator, so it needs TWO controllers over DISJOINT actuator sets:
# `diff_drive` (roqsim_mobile) owns the two wheel velocity servos, `arm_controller` (roqsim_manipulation)
# owns the seven Panda position servos plus the Franka Hand tendon. The `joints:` list is what keeps
# them disjoint -- without it arm_controller's prefix scan would also grab the wheel motors and
# position-hold them, fighting diff_drive for the wheels (the robot then simply will not drive).

# The Panda meshes are borrowed from roqsim_manipulation rather than copied: the model reuses the exact
# Menagerie-derived, per-material split meshes the `panda` model already ships (architecture.rst §4).
# Only the Omron base mesh is this package's own, in meshes/frankie/.
assets: [roqsim_manipulation_assets]

components:
  # Base: a TRUE two-wheel differential drive with passive casters -- not a skid-steer. It therefore
  # needs no `slip_factor` calibration (the husky and G2 both do, because their fixed side-by-side
  # wheels must scrub sideways to yaw; a diff-drive's do not). slip_factor is left at its 1.0 default
  # and the drive tests assert the ideal kinematics directly.
  - diff_drive:
      wheel_radius: 0.0625          # substrate assumption -- the source URDF models the base as a
                                    # virtual yaw+prismatic joint pair with no wheels at all
      wheel_separation: 0.36        # track; inside the 0.47 m body width
      max_linear_vel: 0.5           # the LD-60 platform's own limit is 0.4 m/s; 0.5 leaves headroom
                                    # for studies that drive the base past its rated speed. Override
                                    # it in the world if a run must stay inside the hardware limit.
      max_angular_vel: 1.0
      wheel_accel_limit: 2.0        # rad/s^2 ramp on the wheel command
      left_actuator: left_wheel_motor
      right_actuator: right_wheel_motor
      left_joint: left_wheel_joint
      right_joint: right_wheel_joint
  # Arm: explicit `joints:` ownership (see above). velocity_commands is ON because this robot exists
  # for a reactive architecture whose QP resolves to joint velocities -- that is the whole point of the
  # platform. Position commands still work; the two paths are mutually exclusive per tick.
  - arm_controller:
      joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
      gripper_actuator: actuator8   # the Franka Hand tendon; not inferable under explicit ownership
      gripper_joint: finger_joint1  # reported gripper position
      gripper_open: 0.0
      gripper_close: 0.04           # Franka Hand: 0..0.04 m per finger
      velocity_commands: true       # joint-velocity input (rad/s), integrated into the held target
      stream_commands: true         # also keep the high-rate position-stream path available
      # Rest stance = `qr`, the ready pose the Robotics Toolbox Frankie model ships (see the port log
      # for the source). Declaring it is NOT optional here: spawn_robot sets only the base pose,
      # so without a stance the arm falls back to qpos0 (all joints zero) -- a pose where the stock
      # Panda's link5 and hand collision geoms overlap by 0.030 m. `rest` seeds the spawn qpos AND the
      # held target, and is re-seated on reset so repeated trials start identically.
      rest:
        joint1: 0.0
        joint2: -0.3
        joint3: 0.0
        joint4: -2.2
        joint5: 0.0
        joint6: 2.0
        joint7: 0.7853981633974483

  # The base's Safety Laser Scanner: an Omron OS32C. Omron's LD-60/90 Platform User's Manual, Cat. No.
  # I611-E-09 ("I611"), names the scanner's settings "OS32C laser settings" (p. 16, 1-30, 4-49) and
  # lists the OS32C Series User's Manual (Z296) among its related manuals; QUT's Frankie is an LD-60
  # (qcr/frankie_docs README; Haviland et al., RA-L 2022, Sec. IV-A). No QUT source names the scanner,
  # and QUT's unit was not identified by serial or label.
  #
  # Mount: the scan plane 190 mm above the floor (I611 p. 1-6 "Safety Laser Scanner"; p. 2-13 "Laser
  # Specifications": "240 deg field of view 190 mm from floor surface"). base_link rests on the floor,
  # so the device's mounting face is 0.190 - 0.067 (its scan plane above its base, Z298 p. 5) = 0.123.
  # x 0.265 is the centre of the CAD's scanner space (the qut_frankie_description mesh); no source
  # states the horizontal position, so it is unverified. The scanner looks out through the LD's
  # channel, which the model's skin and collision geometry carry open (build_frankie_mjcf.py
  # CHANNEL_Z; I611 p. 1-19).
  - spawn_sensor:
      model: omron_os32c
      parent_frame: base_link
      pos: [0.265, 0.0, 0.123]
      rpy: [0.0, 0.0, 0.0]
    name: lidar
    components:
      # Omron's setting for this robot, over the OS32C's own 270 deg: I611 p. 1-6 and p. 2-13, "a 240 deg
      # field of view". At the scanner's 0.4 deg resolution (Z298 p. 5) that is 601 beams, +-120 deg.
      #
      # No range override. I611 p. 1-6 adds "with a range of 3 m": that is the protective range, the
      # OS32C's safety zone (3.0 m at 50/70 mm object resolution, Z298 p. 5), which I611 ch. 4-19
      # ("Safety Laser Scanner Zones") configures. The platform navigates and maps on the same scanner's
      # range data (I611 p. 1-13 "primary method of localization utilizes the Safety Laser Scanner",
      # p. 1-14 "range data from the Safety Laser Scanner as its primary means of detecting obstacles",
      # p. 3-86 maps "out of operating range"), and Omron's LD platform guide states the navigation
      # laser's "typical maximum range of 15 m" (LD Platform OEM User's Guide 11970-000 Rev K, p. 112),
      # which is the device's 15 m warning zone.
      #
      # QUT's stack reads no LaserScan: qcr/ros_omron_agv's laser_node republishes the platform's ARAM
      # laser points as a map-frame PointCloud2. The LaserScan conventions are the device's ROS 1
      # driver's (see omron_os32c.manifest.yaml).
      - lidar:
          rays: 601
          angle_min: -2.094395102   # -120 deg
          angle_max: 2.094395102    # +120 deg
