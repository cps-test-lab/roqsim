# PAL Robotics TIAGo Pro in an empty room — standalone demo world (roqsim_mobile_manipulation).
#
# Standalone:  roqsim sim roqsim_mobile_manipulation:tiago_pro_ros2
# Drive it by hand instead:  roqsim sim roqsim_mobile_manipulation:tiago_pro_ros2 --manual-control
# For ROS 2 / nav2, see the roqsim_ros_bridge and roqsim_nav2_example packages.
#
# In the viewer, toggle geom group 3 to see the collision overlay (the source's convex hulls and
# primitives) on top of the visual meshes.

sim:
  pacing: realtime      # realtime | asap | {factor: N}

components:
  # omni_drive (holonomic planar base + 4 mecanum wheel servos), the torso/head and both arm+gripper
  # controllers, and the two SICK TIM571 lidars all come from the tiago_pro model manifest
  # (models/tiago_pro/tiago_pro.manifest.yaml) -- including the arms' `rest` stance, without which they would
  # spawn stretched straight out in front of the robot.
  - spawn_robot:
      model: tiago_pro
      pos: [0.0, 0.0]
      yaw: 0.0
    name: robot

  # Override the manifest's omni_drive only to add test_cmd: with no ROS to send /cmd_vel, this
  # scripted [vx, vy, wz] gives the standalone scene some motion.
  #
  # [0.3, 0.3, 0.0] is a DIAGONAL translation at a constant heading -- the thing this base can do
  # and no other roqsim base can. Two other instructive settings:
  #   [0.0, 0.4, 0.0]  pure sideways strafe, heading locked
  #   [0.0, 0.0, 1.0]  rotation in place with no translation
  # All are inside PAL's limits (vx/vy 1.0 m/s, wz 2.09 rad/s).
    components:
      - omni_drive:
          test_cmd: [0.3, 0.3, 0.0]   # remove once the ros2_bridge drives /cmd_vel

  # For ROS 2 (separate colcon package roqsim_ros_bridge): one bridge reads every declared endpoint
  # from ctx.interface -- no per-topic config needed. This robot declares cmd_vel/odom + three
  # joint_states producers (base, torso/head, both arms) + two GripperCommand actions + two scans
  # (scan_front, scan_rear). For >1 robot, set `namespace: <name>` on each spawn_robot.
  # - ros2_bridge: {}
