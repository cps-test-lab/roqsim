# Franka Research 3 without a hand: seven torque motors and nothing else.
#
# No default plugins. Gravity is not compensated by the model: on the robot the controller adds it
# from its model and the load it was told, and in simulation so does `franka_fci`
# (roqsim_manipulation), which a world declares under the arm with the settings only the world can
# give -- the collision thresholds, the configured load, the address the arm's FCI is served on. A
# bare `spawn_arm: {model: fr3}` is the arm with its controller off: it falls.
end_effector:
  site: attachment_site
