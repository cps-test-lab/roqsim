# Default plugins shipped with the OpenMANIPULATOR-X arm description.
#
# `spawn_arm: {model: open_manipulator_x}` pulls this in automatically, so a world does not
# re-declare the arm's controller. To override a default, nest an entry with the same label under
# that spawn_arm's `components:` (it merges into this one, per key); to opt out, set `spawn_arm`
# config `default_plugins: false`. Each entry below attaches to the spawned arm because it is nested
# under it -- there is no ownership key to fill in.
components:
  # No gripper keys: the two fingers are welded geometry in the MJCF (no joint, no actuator), so
  # there is nothing for arm_controller to expose a GripperCommand action for.
  - arm_controller: {}

  # The eye-in-hand RealSense D435i is NOT in this manifest, even though the model ships the
  # `d435_color` camera it renders from. Same line the ur5e draws for its force-torque sensor: the
  # arm's contribution is the mount (a camera element at the vendor's own mount pose); whether a run
  # renders from it, at what rate, and whether it reprojects to a point cloud are properties of the
  # experiment. A world that wants it adds, to the arm's spawn entry:
  #
  #     components:
  #       - realsense_d435: {depth_camera: d435_color, depth: true, points: true}

# Where spawn_arm's `end_effector:` welds a tool when the world names no `site:`. The tool point
# between the welded fingers.
end_effector:
  site: attachment_site
