# FANUC CRX-25iA, a collaborative arm: 25 kg payload at 1889 mm reach, 135 kg (FANUC Europe
# MDS-04893-EN "CRX-25iA").
#
# The CRX-25iA is CRX-30iA hardware: there is no crx25ia description, FANUC lists the row
# "CRX-30iA (CRX-25iA) | CRX/30-18A | crx30ia" on its supported-models page, and a FANUC maintainer
# names the crx30ia files "the official ones for CRX-25iA" (fanuc_description issue #10). So this
# model is built from FANUC's crx30ia; a search for crx30ia / CRX-30iA finds it here. Its rating is
# the CRX-25iA's (the CRX-30iA is rated 30 kg at 1756 mm on the same arm).
# Generated from FANUC's own description: external/convert/build_fanuc_mjcf.py.
#
# Over ROS 2 the arm answers as FANUC's driver does (fanuc_driver_interface; roqsim's
# docs/interfaces.rst has the table of every name): joints J1..J6 under the driver's prefix
# (spawn_arm's `prefix`, arm_controller's `joint_prefix` and fanuc_driver_interface's `prefix`).
components:
  - arm_controller:
      # FANUC's driver names (fanuc_hardware_interface/config/ros2_controllers.yaml): the scaled
      # trajectory controller, the broadcaster, the forward position controller it defines but does
      # not spawn, and the constraints it grades a goal by.
      controller_name: joint_trajectory_controller
      controller_type: fanuc_controllers/ScaledJointTrajectoryController
      joint_state_broadcaster_name: joint_state_broadcaster
      forward_command_controller: forward_position_controller
      stream_commands: true
      goal_tolerance: 0.05
      path_tolerance: 0.25
      goal_time_tolerance: 0.0       # 0: no limit, upstream's convention
      allow_partial_joints_goal: false
      allow_nonzero_velocity_at_trajectory_end: false
      # The hardware exports position and velocity, no effort (*_ros2_control_macro.xacro); the
      # broadcaster publishes every control period (update_rate 500 Hz, the physics step), the
      # trajectory controller's state at state_publish_rate.
      state_interfaces: [position, velocity]
      joint_state_rate: 0.0
      controller_state_rate: 100.0
      dynamic_joint_states: true
      # A servo handed only positions trails a trajectory by kv*qd/kp; FANUC's own controller
      # does not. Both command paths are fed forward.
      trajectory_feedforward: velocity
      command_feedforward: velocity
      # FANUC's maximum speeds (datasheet and description agree), rad/s: 80, 80, 120, 180, 180,
      # 180 deg/s.
      max_velocity:
        J1: 1.39626
        J2: 1.39626
        J3: 2.0944
        J4: 3.14159
        J5: 3.14159
        J6: 3.14159
  - fanuc_driver_interface:
      collaborative: true
      # Assumed (FANUC publishes no contact-stop threshold): the order of magnitude of ISO/TS 15066's
      # transient contact forces. The port log records its sensitivity.
      contact_stop_force: 150.0
      # FANUC's example_gpio_config.yaml (fanuc_hardware_interface/config, Apache-2.0), the gpio map
      # fanuc_moveit.launch.py loads by default for a CRX.
      gpio_topic_config:
        io_state:
          - {type: DI, start: 101, length: 12}
          - {type: DO, start: 101, length: 12}
          - {type: RI, start: 1, length: 2}
          - {type: RO, start: 1, length: 2}
          - {type: F, start: 1, length: 32}
        io_cmd:
          - {type: DO, start: 101, length: 12}
          - {type: RO, start: 1, length: 2}
          - {type: F, start: 1, length: 32}
        num_reg_state: [{start: 1, length: 3}]
        num_reg_cmd: [{start: 3, length: 3}]
end_effector:
  site: tool_site
