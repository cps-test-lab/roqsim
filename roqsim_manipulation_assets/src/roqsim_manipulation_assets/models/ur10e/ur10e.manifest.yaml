# Default controller shipped with the ur10e arm description.
#
# `spawn_arm: {model: ur10e}` pulls this in automatically, so a world does not re-declare the arm's
# controller. To override a default, nest an entry with the same label under that spawn_arm's
# `components:` (it merges into this one, per key); to opt out, set `spawn_arm` config
# `default_plugins: false`. Each entry below attaches to the spawned arm because it is nested under
# it -- there is no ownership key to fill in.
components:
  - arm_controller: {}   # gripper_ctrl and the home target keep the plugin/model defaults

# Where spawn_arm's `end_effector:` welds a tool when the world names no `site:`. The flange; the
# conveyor plate it ships there is removed with `end_effector.replaces: [ee_plate]`.
end_effector:
  site: attachment_site
