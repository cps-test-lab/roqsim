# Default controller shipped with the ur5e arm description.
#
# `spawn_arm: {model: ur5e}` pulls this in automatically, so a world does not re-declare the arm's
# controller. To override a default, nest an entry with the same label under that spawn_arm's
# `components:` (it merges into this one, per key); to opt out, set `spawn_arm` config
# `default_plugins: false`. Each entry below attaches to the spawned arm because it is nested under
# it -- there is no ownership key to fill in.
#
# The FT sensor is deliberately NOT in this manifest. A model manifest carries what the robot always
# has; whether a run measures the wrench, in which frame, and with how much noise are properties of
# the experiment. The arm ships the `fts_site` to measure at -- a world adds `force_torque`.
components:
  - arm_controller: {}   # the home target keeps the plugin/model defaults

# Where spawn_arm's `end_effector:` welds a tool when the world names no `site:`. Not the bare
# flange: `attachment_site` is on wrist_3_link, beside the FT stack (`tool0`) rather than under it,
# so a tool welded there would be invisible to a force_torque at `fts_site`. `tool_site` is the
# stack's outer face, below the cut.
end_effector:
  site: tool_site
