# FANUC M-20iD/25 on the floor -- standalone demo world (roqsim_manipulation_assets).
#
# Standalone: roqsim sim roqsim_manipulation_assets:m20id25_demo
# A `test_target` drives the arm to a pose so the standalone scene shows motion; remove it before
# driving the arm from ROS 2, or it holds the arm against every command.
#
# The base sits on the floor at the world origin, as FANUC's robot/m20_25_18d.urdf.xacro mounts it,
# so FANUC's xacro and this world agree on the world frame a MoveIt configuration plans in. Joints
# J1..J6 under FANUC's default (empty) prefix; the manifest serves FANUC's driver names.

sim:
  pacing: realtime      # realtime | asap | {factor: N}

components:
  - spawn_arm:
      model: m20id25
    name: m20id25
    components:
      - arm_controller:
          test_target: [0.6, 0.5, 0.2, 0.0, -1.3, 0.0]

  # A work table in front of the arm, its top at 0.75 m and its near edge 1.0 m out: inside the
  # 1.831 m reach, outside the arm's own sweep at home. Static: furniture, not a workpiece.
  - box:
      pose: {position: {x: 1.4, y: 0.0, z: 0.375}}
      size: [0.8, 1.2, 0.75]
      color: [0.55, 0.57, 0.6, 1.0]
      motion: static
      prefix: "table_"
    name: table
