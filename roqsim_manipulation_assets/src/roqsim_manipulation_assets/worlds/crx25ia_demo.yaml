# FANUC CRX-25iA on a bench, with a Robotiq Hand-E -- standalone demo world (roqsim_manipulation_assets).
#
# Standalone: roqsim sim roqsim_manipulation_assets:crx25ia_demo
# A `test_target` drives the arm to a pose so the standalone scene shows motion; remove it before
# driving the arm from ROS 2, or it holds the arm against every command.
#
# The CRX-25iA is FANUC's crx30ia model (see the manifest). Its base sits 0.75 m up, on the bench
# top, exactly where FANUC's robot/crx30ia.urdf.xacro mounts it (`world -> base_link` z 0.75), so
# FANUC's xacro and this world agree on the world frame a MoveIt configuration plans in. Joints
# J1..J6 under FANUC's default (empty) prefix; the manifest serves FANUC's driver names.

sim:
  pacing: realtime      # realtime | asap | {factor: N}
  # A grasping world needs these, and the gripper deliberately does not carry them: they are
  # world-scoped (see ur5e_robotiq_hande_demo.yaml).
  cone: elliptic
  impratio: 10
  noslip_iterations: 10

components:
  # motion: static -- the arm is bolted to this bench.
  - box:
      pose: {position: {x: 0.0, y: 0.0, z: 0.375}}
      size: [0.6, 0.6, 0.75]
      color: [0.93, 0.93, 0.95, 1.0]
      motion: static
      prefix: "bench_"
    name: bench

  # The Hand-E's coupling face on the CRX's tool_site, which is FANUC's fanuc_flange (z out of the
  # flange).
  - spawn_arm:
      model: crx25ia
      pose: {position: {z: 0.75}}
      end_effector: {model: robotiq_hande}
    name: crx25ia
    components:
      - arm_controller:
          test_target: [0.6, 0.5, 0.4, 0.0, -1.3, 0.0]

  # A work surface beside the bench, top at 0.75 m, inside the 1.889 m reach.
  - box:
      pose: {position: {x: 1.0, y: 0.0, z: 0.375}}
      size: [0.8, 1.0, 0.75]
      color: [0.55, 0.57, 0.6, 1.0]
      motion: static
      prefix: "table_"
    name: table
