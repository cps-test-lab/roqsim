name: ci

# Two jobs on purpose. `core` is the PR gate: no ROS, no nav2, ~minutes, and it runs `make ci` --
# every check is a make target, so a contributor reproduces CI exactly with one command and the two
# cannot drift. `ros` carries the heavy integration (colcon build + the nav2 goal test) and is kept
# separate so a formatting mistake does not wait behind a robot driving to a goal.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (lint, tests, smoke, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MuJoCo renders offscreen here. A GitHub runner has no /dev/dri render node at all, so
      # roqsim's own backend selection picks osmesa rather than egl -- hence libosmesa6, not just
      # libegl1.
      # ffmpeg is what `roqsim render --out x.webm` shells out to; without it the video tests fail
      # with the code's own "ffmpeg is not on PATH" error, which is a missing runner dep, not a bug.
      # python3-tk is the scene-builder's GUI test dependency. tkinter ships with CPython but Ubuntu
      # packages it separately, and this runner already has the Xvfb those tests map their window on --
      # so the display fixture runs and `import tkinter` is what fails. The ros job has no Xvfb and
      # skips them, which makes this the only job that measures the review panel's real geometry.
      - name: Install GL libraries, ffmpeg and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libosmesa6 ffmpeg python3-tk

      - name: Create venv and install packages
        run: make venv

      # lint + test + smoke + check + doc. `make test` skips the ros2_ws suite when ROS is not
      # sourced, which is exactly right here -- the `ros` job below owns that half.
      - name: make ci
        run: make ci

  ros:
    name: ros (bridge + nav2 integration)
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v4

      # Same GL and ffmpeg deps as the core job, and for the same reasons: no /dev/dri render node on a
      # runner so the offscreen backend resolves to osmesa, and `roqsim render --out x.webm` shells out
      # to ffmpeg. Having given them to one job and not the other is what left 9 tests failing here
      # after the collection fix, on a commit whose core job was already green.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-venv python3-pip python3-colcon-common-extensions \
            libegl1 libgl1 libosmesa6 ffmpeg \
            ros-jazzy-navigation2 ros-jazzy-nav2-bringup \
            ros-jazzy-nav2-minimal-tb4-description \
            ros-jazzy-nav2-simple-commander \
            ros-jazzy-simulation-interfaces

      - name: Create venv and install packages
        run: make venv

      # With ROS sourced, `make test` additionally builds ros2_ws and runs its suites, including the
      # headless nav2 goal test. That conditional lives in the Makefile, not here.
      - name: make test (with ROS sourced)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          make test
