[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario_execution_roqsim"
version = "0.1.0"
description = "OpenSCENARIO 2 actions for roqsim: observe an entity's motion and inject a physical fault, from a stepped or a ROS run."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# NOTE the absentee: `scenario_execution` is NOT here, although every action imports it.
#
# The PyPI name resolves to a DIFFERENT, older project than the fork this substrate runs against, and
# installing it does active harm: roqsim's own venv and CI would get 1.3.0, which has no
# SimulationInterface at all; and in a campaign image -- where scenario-execution lives in /ws as a
# colcon package rather than a wheel -- a pip'd copy sits alongside it on sys.path and the parser
# raises "More than one import library for helpers found", failing every campaign at parse time with a
# message that reads like a broken .osc.
#
# So the dependency is real, unsatisfiable by name, and declared as an extra instead. Every environment
# that RUNS these actions already provides it (the campaign image, the monorepo venv, a sourced colcon
# workspace); an environment that does not gets an ImportError naming it, which is the loud failure the
# repo's rules ask for rather than a silent wrong version.
dependencies = [
    "roqsim",                     # the entity/body resolver and SimContext (the in-process seam)
    "numpy>=1.24",             # the displacement arithmetic
    "py_trees>=2.2",           # action status; already a roqsim dependency via roqsim_walker
]

[project.optional-dependencies]
# `pip install -e .[osc]` is a no-op wherever scenario-execution is already importable, and a clear
# failure where it is not. See the note above for why it cannot be a hard dependency.
osc = ["scenario_execution"]
test = ["pytest>=7.0", "mujoco>=3.0"]

# The OSC library, so `import osc.roqsim` resolves. The entry-point NAME is what a scenario imports.
[project.entry-points."scenario_execution.osc_libraries"]
roqsim = "scenario_execution_roqsim.get_osc_library:get_osc_library"

# The actions. Entry-point names are GLOBAL across every installed package -- scenario-execution errors
# with "More than one plugin is found" on a collision -- so they are prefixed by what they act on
# (`entity_`, `model_`) rather than by a verb.
[project.entry-points."scenario_execution.actions"]
entity_moved = "scenario_execution_roqsim.actions.entity_moved:EntityMoved"
entity_rotated = "scenario_execution_roqsim.actions.entity_rotated:EntityRotated"
entity_navigate = "scenario_execution_roqsim.actions.entity_navigate:EntityNavigate"
entity_navigate_start = "scenario_execution_roqsim.actions.entity_navigate:EntityNavigateStart"
entity_teleport = "scenario_execution_roqsim.actions.entity_teleport:EntityTeleport"
set_model_override = "scenario_execution_roqsim.actions.set_model_override:SetModelOverride"
set_sensor_override = "scenario_execution_roqsim.actions.set_sensor_override:SetSensorOverride"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scenario_execution_roqsim = ["lib_osc/*.osc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
