[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario_execution_roqsim"
version = "0.1.0"
description = "OpenSCENARIO 2 actions for roqsim: observe an entity's motion and where it is, read what its plugins report and send any command they declare, in-process or over the simulator's control socket."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# NOTE the absentee: `scenario_execution` is NOT here, although every action imports it.
#
# Where scenario-execution is a colcon package (a sourced ROS workspace), a pip-installed copy beside
# it puts two copies on sys.path, and the parser finds two import libraries ("More than one import
# library for helpers found") and refuses every scenario. So it is the `[osc]` extra, not a hard
# dependency.
dependencies = [
    "roqsim[ipc]",                # the in-process seam, and the control socket's client
    "numpy>=1.24",             # the displacement arithmetic
    "py_trees>=2.2",           # action status; already a roqsim dependency via roqsim_walker
]

[project.optional-dependencies]
# scenario-execution from PyPI, for an environment that does not already provide it; see the note
# above for why it is not a hard dependency.
osc = ["scenario-execution>=1.8"]
test = ["pytest>=7.0", "mujoco>=3.14,<3.15"]

# A world entry that runs an OpenSCENARIO file (`- scenario: {file: x.osc}`).
[project.entry-points."roqsim.plugins"]
scenario = "scenario_execution_roqsim.scenario_file:ScenarioFilePlugin"

# The OSC library, so `import osc.roqsim` resolves. The entry-point NAME is what a scenario imports.
[project.entry-points."scenario_execution.osc_libraries"]
roqsim = "scenario_execution_roqsim.get_osc_library:get_osc_library"

# The actions. An invocation binds to the implementation from the package whose library declared the
# action, so a name shared with another installed package (`spawn_entity`) is not a collision; two
# imported libraries declaring one name are refused at parse time. The `entity_` prefix names what an
# action acts on.
[project.entry-points."scenario_execution.actions"]
entity_moved = "scenario_execution_roqsim.actions.entity_moved:EntityMoved"
entity_monitor = "scenario_execution_roqsim.actions.entity_monitor:EntityMonitor"
entity_near = "scenario_execution_roqsim.actions.entity_near:EntityNear"
entity_near_position = "scenario_execution_roqsim.actions.entity_near:EntityNearPosition"
entity_in_region = "scenario_execution_roqsim.actions.entity_in_region:EntityInRegion"
entity_rotated = "scenario_execution_roqsim.actions.entity_rotated:EntityRotated"
entity_navigate = "scenario_execution_roqsim.actions.entity_navigate:EntityNavigate"
entity_navigate_start = "scenario_execution_roqsim.actions.entity_navigate:EntityNavigateStart"
delete_entity = "scenario_execution_roqsim.actions.delete_entity:DeleteEntity"
set_entity_state = "scenario_execution_roqsim.actions.set_entity_state:SetEntityState"
spawn_entity = "scenario_execution_roqsim.actions.spawn_entity:SpawnEntity"
entity_call = "scenario_execution_roqsim.actions.entity_call:EntityCall"
machine_run = "scenario_execution_roqsim.actions.machine_run:MachineRun"
humanoid_approach = "scenario_execution_roqsim.actions.humanoid:HumanoidApproach"
humanoid_reach = "scenario_execution_roqsim.actions.humanoid:HumanoidReach"
humanoid_press = "scenario_execution_roqsim.actions.humanoid:HumanoidPress"
humanoid_grasp = "scenario_execution_roqsim.actions.humanoid:HumanoidGrasp"
humanoid_release = "scenario_execution_roqsim.actions.humanoid:HumanoidRelease"
humanoid_pull = "scenario_execution_roqsim.actions.humanoid:HumanoidPull"
humanoid_push = "scenario_execution_roqsim.actions.humanoid:HumanoidPush"
humanoid_carry = "scenario_execution_roqsim.actions.humanoid:HumanoidCarry"
humanoid_place = "scenario_execution_roqsim.actions.humanoid:HumanoidPlace"
humanoid_play = "scenario_execution_roqsim.actions.humanoid:HumanoidPlay"
humanoid_stop_clip = "scenario_execution_roqsim.actions.humanoid:HumanoidStopClip"
humanoid_look_at = "scenario_execution_roqsim.actions.humanoid:HumanoidLookAt"
zone_entered = "scenario_execution_roqsim.actions.zone:ZoneEntered"
zone_left = "scenario_execution_roqsim.actions.zone:ZoneLeft"
zone_dwelled = "scenario_execution_roqsim.actions.zone:ZoneDwelled"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scenario_execution_roqsim = ["lib_osc/*.osc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
