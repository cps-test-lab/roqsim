# Copied unchanged from iRobotEducation/create3_sim (irobot_create_common_bringup/config/hazard_vector_params.yaml,
# BSD-3-Clause, Copyright 2021 iRobot Corporation), so the node runs with the parameters its
# maintainers ship; roqsim's TurtleBot 4 publishes on the topics named here.
/**:
  hazards_vector_publisher:
    ros__parameters:
      # Hazard detection publisher topic
      publisher_topic: hazard_detection
      publish_rate: 62.0
      subscription_topics:
        # Bumper topic
        - _internal/bumper/event
        # Cliff topics
        - _internal/cliff_front_left/event
        - _internal/cliff_front_right/event
        - _internal/cliff_side_left/event
        - _internal/cliff_side_right/event
        # Wheel drop topics
        - _internal/wheel_drop/left_wheel/event
        - _internal/wheel_drop/right_wheel/event
        # Backup limit topic
        - _internal/backup_limit
