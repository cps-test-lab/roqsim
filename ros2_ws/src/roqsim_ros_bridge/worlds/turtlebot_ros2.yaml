# TurtleBot 4 + ROS 2 bridge, driven via /cmd_vel and nav2-ready.
#
#   ros2 run roqsim_ros_bridge roqsim_bridge --world <this file>
#   # then, in another sourced shell:
#   ros2 topic echo /odom        ros2 topic echo /scan
#   ros2 topic pub /cmd_vel geometry_msgs/Twist '{linear: {x: 0.2}, angular: {z: 0.3}}'

sim:
  pacing: realtime

components:
  # diff_drive + lidar come from the turtlebot4 model manifest (models/turtlebot4/turtlebot4.manifest.yaml);
  # driven via /cmd_vel, so no test_cmd override here.
  - spawn_robot:
      model: turtlebot4
      pose:
        position:    {x: 0.0, y: 0.0}
        orientation: {yaw: 0.0}
    name: robot

  # The bridge reads the robot's declared endpoints (cmd_vel in; odom+tf, scan, joint_states out)
  # from ctx.interface -- topics/types/frames/rates are declared on the robot, not configured here.
  # Single robot => bare topics (/cmd_vel, /odom, ...). For a second robot give each spawn_robot its
  # own `namespace:`; this one bridge then serves both under /<namespace>/... A bridge's own
  # `namespace` is a global prefix over every endpoint it serves.
  - ros2_bridge: {}

  - sim_interfaces: {}
