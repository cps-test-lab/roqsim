# TurtleBot 4 test world for the nav2 example.
#
# For testing only: the built-in empty room, localized by a static map->odom transform. An
# experiment starts from depot_nav2.yaml (docs/nav2_example.rst).
#
# spawn_robot pulls in the turtlebot4 robot description (its diff_drive + RPLIDAR mount), so this
# world only places the robot and wires transport. The ros2_bridge publishes clock/odom/
# tf(odom->base_link)/scan/joint_states, and -- because the robot declares shell_link and the mount
# declares rplidar_link -- the static base_link->shell_link->rplidar_link TF, so the launch file
# needs no robot_state_publisher / URDF chain. A static map->odom identity transform (in the launch
# file) stands in for localization.

sim:
  pacing: realtime

components:
  # diff_drive + the RPLIDAR mount come from the turtlebot4 model manifest (models/turtlebot4/turtlebot4.manifest.yaml).
  - spawn_robot:
      model: turtlebot4
      pose:
        position:    {x: 0.0, y: 0.0}
        orientation: {yaw: 0.0}
    name: robot

  # The bridge reads the robot's declared endpoints from ctx.interface and publishes
  # clock/odom/tf(odom->base_link)/scan/joint_states + the static base_link->shell_link->rplidar_link TF.
  - ros2_bridge: {}

  - sim_interfaces: {}
