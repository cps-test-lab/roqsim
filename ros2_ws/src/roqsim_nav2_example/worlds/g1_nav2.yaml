# Unitree G1 test world for the nav2 example.
#
# For testing only: the built-in empty room, localized by a static map->odom transform. An
# experiment starts from depot_nav2.yaml (docs/nav2_example.rst).
#
# spawn_robot pulls in the unitree_g1 robot description (its g1_locomotion controller and the Livox
# Mid-360 in its head), so this world only places the robot and wires transport. The ros2_bridge
# publishes clock/odom/tf(odom->base_link)/joint_states, the Mid-360's point cloud on livox/lidar
# (sensor_msgs/PointCloud2, frame mid360_link), and the static chain base_link->torso_link->mid360_link
# from the robot's and the sensor mount's frames, so the launch file needs no robot_state_publisher /
# URDF chain. nav2 reads a LaserScan: nav2_g1.launch.py projects the cloud into /scan with
# pointcloud_to_laserscan. A static map->odom identity transform (in the launch file) stands in for
# localization: odom starts at the spawn pose, and the robot spawns at the map origin facing +x.
#
# timestep 0.002 (500 Hz): the G1 locomotion policy's PD loop is tuned for this step.

sim:
  world: empty_room   # the walled empty_room (10 m) matches maps/empty_room.yaml (physical walls the lidar sees)
  timestep: 0.002
  pacing: realtime

components:
  # g1_locomotion + the mid360 mount come from the unitree_g1 model manifest
  # (models/unitree_g1.manifest.yaml).
  - spawn_robot:
      model: unitree_g1
      pose:
        position:    {x: 0.0, y: 0.0}
        orientation: {yaw: 0.0}
    name: robot

  # The bridge reads the robot's declared endpoints from ctx.interface and publishes them.
  - ros2_bridge: {}

  - sim_interfaces: {}
