# One robot under test, three opponents the simulator drives itself.
#
#   roqsim sim roqsim_nav:nav_opponents
#
# `robot` is the SUBJECT: a TurtleBot 4 with the sensors its manifest brings, and nothing driving it.
# Left alone it stands still; give it a stack and it is the thing being measured.
#
# The other three are APPARATUS. Each has a `navigator` component, so each plans with A* over a grid
# read off this world's own wall geoms, follows it, and stops for anything the planner could not have
# known about. They differ only in how their motion reaches the physics -- the navigator's `output`:
#
#   visitor  walker  a pedestrian: 17 mocap bodies and a gait, zero solver DOFs
#   cart     drive   a second TurtleBot 4 whose wheels really turn, under physics
#   crate    mocap   a prop whose pose is written: collision geometry, zero solver DOFs
#
# `robot` stands still, and that is the point rather than a fault: it is the subject, so nothing in
# this world drives it. Run it under a stack -- or `roqsim sim ... --ros` and drive it over the
# bridge -- and the three opponents carry on around it exactly as they do here.
#
# Between them they also cover both route modes and both start modes:
#
#   visitor  patrols a loop, planning around the walls, and yields to the others
#   cart     runs an EXACT polyline up and down the aisle -- the given points ARE its path, and no
#            planner routes around anything
#   crate    crosses the room once and stops
#
# Three ways to run it, from one file. The bridge is never written into a world: `roqsim sim --ros`
# injects it, which is why this one file covers the ROS cases too.
#
#   roqsim sim roqsim_nav:nav_opponents                 # no ROS anywhere; the opponents navigate
#   roqsim sim roqsim_nav:nav_opponents --ros           # the TB4 is on the ROS graph; opponents not
#   ros2 launch roqsim_nav2_example nav2_turtlebot.launch.py world:=<this file>
#                                                       # nav2 drives the TB4; opponents run inside
#
# Avoidance is named per mover -- `none` (the default) or a model. `sidestep` is pure Python and
# needs nothing to build; `orca` is better and reciprocal, once you have the extra:
#
#   pip install Cython
#   pip install --no-build-isolation git+https://github.com/sybrenstuvel/Python-RVO2.git
#
# The first mover to name one fixes it for the world, because agents can only avoid each other
# inside one model. A mover with `avoidance: none` still STOPS for traffic through its own caution
# probe -- it simply never gives way, so two of those meeting head-on stop nose to nose.
#
# Everything here starts on its own. To hand the timing to a trial instead, give a mover
# `autostart: false` and start it from a scenario, over either transport:
#
#   entity_navigate_start(entity: 'cart')
#
# `roqsim_nav` depends on `roqsim` and nothing else in this tree, so this world names plugins from
# packages it does NOT depend on: `spawn_robot` (roqsim_mobile), `walker` (roqsim_walker) and the
# props (roqsim_assets). In a dev checkout `make venv` installs them all. A missing one fails at
# load, by plugin name.

sim:
  pacing: realtime
  # Far enough back and steep enough to hold the whole 10 x 10 room: every lane below is somewhere
  # in this frame, which is the point of a demo you are meant to watch rather than measure.
  view: {lookat: [0.0, 0.0, 0.0], distance: 15.0, azimuth: 90.0, elevation: -70.0}

components:
  # -- opponents -----------------------------------------------------------------------------------
  # A walker is a MOCAP body: no degrees of freedom, so the solver treats it as immovable and it
  # shoves anything free that it touches -- a 3 kg robot goes over. A walker gets no forward caution
  # probe unless it is asked for, because turning one on by default would change how every existing
  # walker behaves. So this one is given a navigator of its own with `traffic: respect`, and it stops
  # for the traffic instead of walking through it. Worth knowing before putting a walker near a robot.
  - walker: {walker: MaleVisitorWalk, pos: [-3.0, 2.5]}
    name: visitor
    components:
      - navigator:
          output: walker
          speed: 1.1
          goals: [[3.0, 2.5], [3.0, -1.0], [-3.0, -1.0]]
          loop: true
          traffic: respect     # look ahead and stop; a walker's default is `ignore`
          avoidance: sidestep  # and gives way; `none` (the default) looks but never yields
          caution: {lookahead: 1.2, width: 0.8, clear_time: 0.5}

  # A robot and a walker, five metres apart, each driving to where the other started. Nothing plans
  # around the other -- the planner's grid holds walls, not traffic -- so what unpicks it is the
  # avoidance model, and without one they stop nose to nose.
  - spawn_robot: {model: turtlebot4, prefix: 'runner_', namespace: runner, pos: [-2.5, 3.2]}
    name: runner
    components:
      - navigator: {speed: 0.4, goals: [[2.5, 3.2]], avoidance: sidestep}

  - walker: {walker: MaleVisitorWalk, pos: [2.5, 3.2]}
    name: pedestrian
    components:
      - navigator:
          output: walker
          speed: 0.9
          goals: [[-2.5, 3.2]]
          traffic: respect
          avoidance: sidestep

  # Two omnidirectional bases, head-on in the middle of the room, both with full avoidance. An
  # omni base can move sideways without turning first, so its way round an encounter is not a
  # wheeled base's -- one navigator, and the control law comes from what each drive declares itself
  # to be (`RobotHandle.kinematics`), not from anything written here.
  - spawn_robot: {model: mpo_500, prefix: 'omni_a_', namespace: omni_a, pos: [-2.5, 0.0]}
    name: omni_a
    components:
      - navigator: {speed: 0.4, goals: [[2.5, 0.0]], avoidance: sidestep}

  - spawn_robot: {model: mpo_500, prefix: 'omni_b_', namespace: omni_b, pos: [2.5, 0.0], yaw: 3.1416}
    name: omni_b
    components:
      - navigator: {speed: 0.4, goals: [[-2.5, 0.0]], avoidance: sidestep}

  # The same encounter between two robots, and the asymmetry is the point: both LOOK (traffic:
  # respect), only one of them YIELDS. `stopper` has no avoidance, so it drives until its caution
  # probe sees something and then simply holds. `dodger` joins the avoidance model, so it steers
  # around the stationary one and carries on. Neither knows anything about the other in advance --
  # the planner's grid holds walls, not traffic.
  - spawn_robot: {model: turtlebot4, prefix: 'stopper_', namespace: stopper, pos: [-2.5, -4.2]}
    name: stopper
    components:
      - navigator: {speed: 0.35, goals: [[2.5, -4.2]], avoidance: none, traffic: respect}

  - spawn_robot: {model: turtlebot4, prefix: 'dodger_', namespace: dodger, pos: [2.5, -4.2], yaw: 3.1416}
    name: dodger
    components:
      - navigator: {speed: 0.35, goals: [[-2.5, -4.2]], avoidance: sidestep}

  # Shuttling along the far wall, out of everyone else's lanes: a driven prop that is scenery to the
  # rest of the room rather than another thing to negotiate with.
  - spawn_model: {model: graspable_box, scale: 5.0, pos: [4.5, -3.0, 0.125], mocap: true}
    name: crate
    components:
      - navigator:
          speed: 0.4
          goals: [[4.5, 3.0], [4.5, -3.0]]
          loop: true
          radius: 0.25                   # its own half-diagonal, so it plans a path that fits
          obstacle_height: [0.05, 0.6]   # a low crate is not stopped by anything above it
