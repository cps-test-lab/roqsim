# One robot under test, three opponents the simulator drives itself.
#
#   roqsim sim roqsim_nav:nav_opponents
#
# `robot` is the SUBJECT: a TurtleBot 4 with the sensors its manifest brings, and nothing driving it.
# Left alone it stands still; give it a stack and it is the thing being measured.
#
# The other three are APPARATUS. Each has a `navigator` component, so each plans with A* over a grid
# read off this world's own wall geoms, follows it, and stops for anything the planner could not have
# known about. They differ only in how their motion reaches the physics -- the navigator's `output`:
#
#   visitor  walker  a pedestrian: 17 mocap bodies and a gait, zero solver DOFs
#   cart     drive   a second TurtleBot 4 whose wheels really turn, under physics
#   pallet   mocap   a prop whose pose is written: collision geometry, zero solver DOFs
#
# Between them they also cover both route modes and both start modes:
#
#   visitor  patrols a loop, planning around the walls, and yields to the others
#   cart     runs an EXACT polyline down the aisle -- the given points ARE its path, no planner --
#            and is held at its start until something says go (`autostart: false`)
#   pallet   crosses the room once and stops
#
# Three ways to run it, from one file. The bridge is never written into a world: `roqsim sim --ros`
# injects it, which is why this one file covers the ROS cases too.
#
#   roqsim sim roqsim_nav:nav_opponents                 # no ROS anywhere; the opponents navigate
#   roqsim sim roqsim_nav:nav_opponents --ros           # the TB4 is on the ROS graph; opponents not
#   ros2 launch roqsim_nav2_example nav2_turtlebot.launch.py world:=<this file>
#                                                       # nav2 drives the TB4; opponents run inside
#
# To start `cart` from a scenario, over either transport:
#
#   entity_navigate_start(entity: 'cart')
#
# `roqsim_nav` depends on `roqsim` and nothing else in this tree, so this world names plugins from
# packages it does NOT depend on: `spawn_robot` (roqsim_mobile), `walker` (roqsim_walker) and the
# props (roqsim_assets). In a dev checkout `make venv` installs them all. A missing one fails at
# load, by plugin name.

sim:
  pacing: realtime

components:
  # Which local-avoidance model the world's navigators share, declared once. Commented out because
  # `orca` needs `rvo2`, an optional extra built from source -- a shipped example has to run on a
  # machine with no compiler. Uncomment it after `pip install 'roqsim_nav[avoidance]'` and the
  # opponents start stepping around each other instead of only stopping for each other.
  #
  # - avoidance: {model: orca, neighbor_dist: 4.0, time_horizon: 3.0}

  # -- the subject ---------------------------------------------------------------------------------
  # diff_drive, lidar and the OAK-D camera all arrive from the turtlebot4 manifest.
  # `prefix` keeps two of the same model apart in the MJCF; `namespace` keeps their topics
  # apart if a bridge is ever injected.
  - spawn_robot: {model: turtlebot4, prefix: 'sut_', namespace: robot, pos: [0.0, -3.0], yaw: 1.5708}
    name: robot

  # -- opponents -----------------------------------------------------------------------------------
  - walker:
      walker: MaleVisitorWalk
      speed: 1.1
      avoidance: true          # yields, once an `avoidance:` model is declared above
      waypoints:               # the legacy spelling still works: a nested navigator is synthesised
        - [-3.0,  2.5]
        - [ 3.0,  2.5]
        - [ 3.0, -1.0]
        - [-3.0, -1.0]
      loop: true
    name: visitor

  - spawn_robot: {model: turtlebot4, prefix: 'cart_', namespace: cart, pos: [-3.5, 0.5], yaw: 0.0}
    name: cart
    components:
      - navigator:
          speed: 0.3
          route_mode: exact    # the given points ARE the path: no planner, no routing around
          autostart: false     # held here until a scenario starts it
          goals: [[3.5, 0.5]]
          caution: {lookahead: 1.0}

  - spawn_model: {model: graspable_box, pos: [2.5, -2.0, 0.0], mocap: true}
    name: pallet
    components:
      - navigator:
          speed: 0.4
          goals: [[-2.5, -2.0]]
          obstacle_height: [0.05, 0.6]   # a low pallet is not stopped by anything above it
