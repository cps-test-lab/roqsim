# Movers the simulator drives itself: one navigator, four embodiments, four encounters.
#
#   roqsim sim roqsim_nav:nav_opponents
#
# Everything that moves here has a `navigator` component, so each plans with A* over a grid read off
# this world's own wall geoms, follows it, and stops for whatever the planner could not have known
# about. They differ in how their motion reaches the physics -- the navigator's `output`:
#
#   walker  a pedestrian: 17 mocap bodies and a gait, zero solver DOFs
#   drive   a robot whose wheels really turn, under physics, through its own `RobotHandle`
#   mocap   a prop whose pose is written: collision geometry, zero solver DOFs
#
# There is no robot under test in this world, and that is the point: these are APPARATUS, and each
# encounter below is a thing apparatus has to do. Add a subject -- a `spawn_robot` with a stack, or
# `roqsim sim ... --ros` and drive it over the bridge -- and they carry on around it as they do here.
#
# The encounters, north to south:
#
#   visitor              a walker patrolling a loop, planning around the walls, yielding to traffic
#   runner / pedestrian  a robot and a walker 5 m apart, each heading for where the other started
#   omni_a / omni_b      two omnidirectional bases head-on, both with full avoidance
#   stopper / dodger     the same encounter, asymmetric: both LOOK, only one YIELDS
#   explorer             a robot that drives into an obstacle its planner cannot see, and gets out
#   crate                a driven prop shuttling along the east wall, scenery to everyone else
#
# Three ways to run it, from one file. The bridge is never written into a world: `roqsim sim --ros`
# injects it, which is why this one file covers the ROS cases too.
#
#   roqsim sim roqsim_nav:nav_opponents                 # no ROS anywhere; everything navigates
#   roqsim sim roqsim_nav:nav_opponents --ros           # the movers are on the ROS graph
#   ros2 launch roqsim_nav2_example nav2_turtlebot.launch.py world:=<this file>
#
# Avoidance is named per mover -- `none` (the default) or a model. `sidestep` is pure Python and
# needs nothing to build; `orca` is better and reciprocal, once you have the extra:
#
#   pip install Cython
#   pip install --no-build-isolation git+https://github.com/sybrenstuvel/Python-RVO2.git
#
# The first mover to name one fixes it for the world, because agents can only avoid each other
# inside one model. A mover with `avoidance: none` still STOPS for traffic through its own caution
# probe -- it simply never gives way, so two of those meeting head-on stop nose to nose.
#
# Everything here starts on its own. To hand the timing to a trial instead, give a mover
# `autostart: false` and start it from a scenario, over either transport:
#
#   entity_navigate_start(entity: 'explorer')
#
# `roqsim_nav` depends on `roqsim` and nothing else in this tree, so this world names plugins from
# packages it does NOT depend on: `spawn_robot` (roqsim_mobile), `walker` (roqsim_walker) and `box`
# (roqsim_assets). In a dev checkout `make venv` installs them all. A missing one fails at load, by
# plugin name.

sim:
  pacing: realtime
  # Far enough back and steep enough to hold the whole room: every lane below is somewhere in this
  # frame, which is the point of a demo you are meant to watch rather than measure.
  view: {lookat: [0.0, 0.0, 0.0], distance: 16.0, azimuth: 90.0, elevation: -72.0}

components:
  # -- opponents -----------------------------------------------------------------------------------
  # A walker is a MOCAP body: no degrees of freedom, so the solver treats it as immovable and it
  # shoves anything free that it touches -- a 3 kg robot goes over. A walker gets no forward caution
  # probe unless it is asked for, because turning one on by default would change how every existing
  # walker behaves. So this one is given a navigator of its own with `traffic: respect`, and it stops
  # for the traffic instead of walking through it. Worth knowing before putting a walker near a robot.
  - walker: {walker: MaleVisitorWalk, pos: [-4.2, 2.0]}
    name: visitor
    components:
      - navigator:
          output: walker
          speed: 1.1
          goals: [[-4.2, -4.2], [1.5, -4.2], [-4.2, 2.0]]
          loop: true
          traffic: respect     # look ahead and stop; a walker's default is `ignore`
          avoidance: sidestep  # and gives way; `none` (the default) looks but never yields
          caution: {lookahead: 1.2, width: 0.8, clear_time: 0.5}

  # A robot and a walker, five metres apart, each driving to where the other started. Nothing plans
  # around the other -- the planner's grid holds walls, not traffic -- so what unpicks it is the
  # avoidance model, and without one they stop nose to nose.
  - spawn_robot: {model: turtlebot4, prefix: 'runner_', namespace: runner, pos: [-2.5, 4.0]}
    name: runner
    components:
      - navigator: {speed: 0.4, goals: [[2.5, 4.0]], avoidance: sidestep}

  - walker: {walker: MaleVisitorWalk, pos: [2.5, 4.0]}
    name: pedestrian
    components:
      - navigator:
          output: walker
          speed: 0.9
          goals: [[-2.5, 4.0]]
          traffic: respect
          avoidance: sidestep

  # Two omnidirectional bases, head-on in the middle of the room, both with full avoidance. An
  # omni base can move sideways without turning first, so its way round an encounter is not a
  # wheeled base's -- one navigator, and the control law comes from what each drive declares itself
  # to be (`RobotHandle.kinematics`), not from anything written here.
  - spawn_robot: {model: mpo_500, prefix: 'omni_a_', namespace: omni_a, pos: [-2.5, 2.2]}
    name: omni_a
    components:
      - navigator: {speed: 0.4, goals: [[2.5, 2.2]], avoidance: sidestep}

  - spawn_robot: {model: mpo_500, prefix: 'omni_b_', namespace: omni_b, pos: [2.5, 2.2], yaw: 3.1416}
    name: omni_b
    components:
      - navigator: {speed: 0.4, goals: [[-2.5, 2.2]], avoidance: sidestep}

  # The same encounter between two robots, and the asymmetry is the point: both LOOK (traffic:
  # respect), only one of them YIELDS. `stopper` has no avoidance, so it drives until its caution
  # probe sees something and then simply holds. `dodger` joins the avoidance model, so it steers
  # around the stationary one and carries on. Neither knows anything about the other in advance --
  # the planner's grid holds walls, not traffic.
  - spawn_robot: {model: turtlebot4, prefix: 'stopper_', namespace: stopper, pos: [-2.5, 0.4]}
    name: stopper
    components:
      - navigator: {speed: 0.35, goals: [[2.5, 0.4]], avoidance: none, traffic: respect}

  - spawn_robot: {model: turtlebot4, prefix: 'dodger_', namespace: dodger, pos: [2.5, 0.4], yaw: 3.1416}
    name: dodger
    components:
      - navigator: {speed: 0.35, goals: [[-2.5, 0.4]], avoidance: sidestep}

  # -- an obstacle the planner could not have known about ------------------------------------------
  # `explorer` is given a goal on the far side of a U it has no idea is there, and has to get itself
  # out. The U is made of MOCAP boxes, and that is the whole trick: a mocap body has no degrees of
  # freedom, so nothing can shove it, and it is excluded from the planner's grid by the same rule
  # that excludes walkers and driven props -- that grid holds only what cannot move. Welded scenery
  # would not do: it lands in the grid and gets routed around before the robot ever sets off.
  #
  # So the plan goes straight through the U's mouth. What happens next is `on_blocked: replan`:
  #
  #   1. the forward probe stops it at the back wall  (`stop` would end the story here)
  #   2. it remembers WHERE it was stopped, as a disc that expires after `forget_after`
  #   3. the next plan routes around that disc -- into a side wall, which it also remembers
  #   4. with the inside of the U marked out, the only route left is back out of the mouth
  #
  # The memory is what makes step 3 possible at all. The grid is static, so a mover that merely
  # re-planned would compute the identical path and drive back into the same wall for ever. It is
  # deliberately not a costmap: a handful of discs, stamped onto a copy of the raster at plan time
  # and nowhere else.
  #
  # `forget_after` is the knob that matters here. Too short and it forgets the back wall before it
  # has rounded the side; too long and a room it has crossed once is permanently narrower to it.
  - box: {prefix: 'trap_back_', pos: [0.25, -2.3], size: [0.2, 2.0, 0.8], mocap: true}
    name: trap_back
  - box: {prefix: 'trap_n_', pos: [-0.65, -1.4], size: [1.7, 0.2, 0.8], mocap: true}
    name: trap_n
  - box: {prefix: 'trap_s_', pos: [-0.65, -3.2], size: [1.7, 0.2, 0.8], mocap: true}
    name: trap_s

  - spawn_robot: {model: turtlebot4, prefix: 'explorer_', namespace: explorer, pos: [-3.0, -2.3]}
    name: explorer
    components:
      - navigator:
          speed: 0.4
          goals: [[3.5, -2.3]]
          # Everything else is left at its default, deliberately: an example that needs its probe
          # re-tuned to get out of a trap is demonstrating the tuning, not the mechanism.
          caution: {on_blocked: replan}   # `stop` is the default: hold position and keep the path

  # Shuttling along the far wall, out of everyone else's lanes: a driven prop that is scenery to the
  # rest of the room rather than another thing to negotiate with.
  - spawn_model: {model: graspable_box, scale: 5.0, pos: [4.5, -3.0, 0.125], mocap: true}
    name: crate
    components:
      - navigator:
          speed: 0.4
          goals: [[4.5, 3.0], [4.5, -3.0]]
          loop: true
          radius: 0.25                   # its own half-diagonal, so it plans a path that fits
          obstacle_height: [0.05, 0.6]   # a low crate is not stopped by anything above it
