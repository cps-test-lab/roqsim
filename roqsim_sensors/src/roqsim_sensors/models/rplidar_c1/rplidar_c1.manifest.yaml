# Slamtec RPLIDAR C1 2D lidar, as a device `spawn_sensor` mounts -- on its own, or nested in a robot
# manifest at the vendor joint origin.
#
# Mesh, link frames and inertial: Husarion husarion_components_description (see rplidar_c1.xml). Scan
# values: Slamtec "RPLIDAR C1" data sheet v1.0, Figure 2-1 "RPLIDAR Performance" ("data sheet"),
# read from the copy at https://d229kd5ey79jzj.cloudfront.net/3157/SLAMTEC_rplidar_datasheet_C1_v1.0_en.pdf
# (product page https://www.slamtec.com/en/C1).
#
# Frames, as Husarion's macro chains them (slamtec_rplidar.urdf.xacro:249-278 @ 5f783f8): the mount
# body is `rplidar_link`, the housing base the vendor joint origin places, and the scan is stamped in
# its child scan frame. spawn_sensor publishes `parent_frame -> rplidar_link -> {frame_id}`.
#
# spawn_sensor fills `{frame_id}` from the mount's `frame_id`, else from the default below.
# `exclude_body: mount` skips this device's housing and nothing else; `emit_static_tf: false` because
# spawn_sensor publishes the `frames:` chain.
frame_id: laser             # Husarion's scan frame (slamtec_rplidar.urdf.xacro:278 @ 5f783f8)

frames:
  - name: rplidar_link      # the vendor mount link: the housing base, which is the mount body itself
    parent: mount
    pos: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  - name: "{frame_id}"      # the vendor scan frame (slamtec_rplidar.urdf.xacro:142-144, model c1)
    parent: rplidar_link
    pos: [0.0, 0.0, 0.032]
    rpy: [0.0, 0.0, 3.141592654]

components:
  - lidar:
      site: scan
      frame_id: "{frame_id}"
      exclude_body: mount
      emit_static_tf: false
      # What the driver publishes: Slamtec/sllidar_ros2 @ 34300099fa, src/sllidar_node.cpp ("driver"),
      # which Husarion's rplidar image builds (husarion/rplidar-docker, Dockerfile:11). Husarion's
      # launch parameters are unverified; these follow Slamtec's launch/sllidar_c1_launch.py
      # (angle_compensate true, scan_mode Standard).
      #
      # Layout: device limits 0 .. 360 deg (:369-370), published reversed as angle_min = pi - 360 deg,
      # angle_max = pi, angle_increment = (angle_max - angle_min) / (N - 1) (:216-224): the first and
      # the last ray share a bearing. 360 * m slots with m = 2 at the data sheet's 5 kHz and 10 Hz,
      # so 720 rays; the sample rate the device reports in Standard mode is unverified.
      rays: 720
      angle_min: -3.141592654   # pi - 360 deg
      angle_max: 3.141592654    # pi
      # Header: range_min hard-coded 0.05 (:228); range_max is the scan mode's max_distance the device
      # reports (:229), unverified for the C1, so the data sheet's range stands in: 0.05-12 m, white
      # object (70% reflection; 6 m black, 10%).
      range_min: 0.05
      max_range: 12.0
      # Data sheet note [1]: below 0.05 m the lidar still outputs distance data, for reference only.
      # The driver publishes any non-zero distance unmapped, so a too-close surface is published at
      # its distance; a sample reported as 0 is published +inf (:236-240).
      too_close: raw
      no_return: +inf           # src/sllidar_node.cpp:236-240
      rate_hz: 10.0             # data sheet: scanning frequency 8~12 Hz, 10 Hz typical
      # Data sheet: accuracy +-30 mm (25 degC, 10-90% reflection). The data sheet does not say which
      # sigma; taken as 1 sigma. Its 15 mm "resolution" is not a quantisation the driver publishes
      # (0.25 mm steps, :236), so none is applied.
      range_stddev: 0.03
      # Not modelled: the driver writes each sample into m consecutive slots, later samples
      # overwriting earlier ones, and its slots are 0.5 deg while the header's increment is
      # 360 deg / 719; the 0-63 quality it publishes as intensities.

# Sector `spawn_sensor: {show_fov: true}` draws and the coverage catalog reads: the lidar's own
# field and its physical detection limits.
fov:
  near: 0.05
  far: 12.0
  h_min: -3.141592654
  h_max: 3.141592654
  v_min: 0.0
  v_max: 0.0
