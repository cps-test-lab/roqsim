# Default capture plugin shipped with the oakd mount.
#
# `spawn_sensor: {model: oakd}` pulls this in automatically, so a world does not re-declare the
# capture plugin. To override, declare oakd_camera for the same mount in the world (it wins); to opt
# out, set spawn_sensor config `default_plugins: false`. `robot` is filled in from the spawn_sensor
# `name`.
components:
  - oakd_camera:
      camera: oakd_rgb

# Valid detection range (m) the `spawn_sensor` show_fov cone is drawn to, and what the coverage
# catalog reads for a hypothetical OAK-D placement.
fov:
  near: 0.3    # the source URDF's Gazebo clip near, which is also oakd_camera's clip_near.
  far: 8.0     # A DISPLAY / ANALYSIS range, deliberately NOT the plugin's clip_far (100.0, the
               # URDF's own far): a colour camera has no physical far, and a 100 m cone drawn in a
               # room is useless. Luxonis quotes an ideal depth range to 12 m. See
               # coverage/catalog.py on tuning it per study.
