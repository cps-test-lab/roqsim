# Intel RealSense D455, as a device `spawn_sensor` mounts -- on its own, or nested in a robot manifest
# at the vendor joint origin of `<device_name>_link`.
#
# `spawn_sensor: {model: realsense_d455}` pulls the capture plugin in automatically, so a world does
# not re-declare it. To override, declare realsense_d455 for the same mount in the world (it wins);
# to opt out, set spawn_sensor config `default_plugins: false`. `robot` is filled in from the
# spawn_sensor `name`.
#
# The mount is `camera_link` of the vendor macro `sensor_d455` (see realsense_d455.xml); spawn_sensor
# publishes the chain below from it. A second D455 on one carrier sets its own `device_name`.
# Depth, when switched on, is rendered through `d455_color` -- the model has one camera -- and
# stamped in `{device_name}_depth_optical_frame` as realsense2_camera stamps it; the vendor puts
# that frame 59 mm from the colour frame along the baseline.

# --- generated by external/convert/build_realsense_devices.py from realsense2_description
# (urdf/_d455.urdf.xacro, nominal extrinsics). The macro's `name` param is the device name.
device_name: camera
frame_id: "{device_name}_color_optical_frame"
frames:
  - {name: "{device_name}_link", parent: mount}
  - {name: "{device_name}_color_frame", parent: "{device_name}_link", pos: [0, -0.059, 0]}
  - {name: "{frame_id}", parent: "{device_name}_color_frame", rpy: [-1.5707963268, 0, -1.5707963268]}
  - {name: "{device_name}_depth_frame", parent: "{device_name}_link", pos: [0, 0, 0]}
  - {name: "{device_name}_depth_optical_frame", parent: "{device_name}_depth_frame", rpy: [-1.5707963268, 0, -1.5707963268]}
# --- end of generated block

components:
  - realsense_d455:
      camera: d455_color
      frame_id: "{frame_id}"
      depth_frame_id: "{device_name}_depth_optical_frame"

# Valid detection range (m) the `spawn_sensor` show_fov cone is drawn to, and what the coverage
# catalog reads for a hypothetical D455 placement. `near` is the datasheet min depth (which is also
# realsense_d455's clip_near); `far` is a display/analysis range -- a camera has no physical far.
fov:
  near: 0.6
  far: 6.0
