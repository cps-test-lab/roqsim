# Intel RealSense D415, as a device `spawn_sensor` mounts -- on its own, or nested in a robot manifest
# at the origin the robot description gives the vendor macro.
#
# `spawn_sensor: {model: realsense_d415}` pulls the capture plugin in automatically, so a world does
# not re-declare it. To override, declare realsense_d415 for the same mount in the world (it wins);
# to opt out, set spawn_sensor config `default_plugins: false`. `robot` is filled in from the
# spawn_sensor `name`.
#
# The mount is `camera_bottom_screw_frame`, the frame the vendor macro `sensor_d415` attaches to its
# parent (see realsense_d415.xml); spawn_sensor publishes the chain below from it. A second D415 on
# one carrier sets its own `device_name`, as a second instance of the macro sets its own `name`. The
# model's `d415_depth` camera sits at the vendor depth optical frame with the depth stream's
# data-sheet optics; the realsense_d415 plugin renders colour only.

# --- generated by external/convert/build_realsense_devices.py from realsense2_description
# (urdf/_d415.urdf.xacro, nominal extrinsics). The macro's `name` param is the device name.
device_name: camera
frame_id: "{device_name}_color_optical_frame"
frames:
  - {name: "{device_name}_bottom_screw_frame", parent: mount}
  - {name: "{device_name}_link", parent: "{device_name}_bottom_screw_frame", pose: {position: {y: 0.02, z: 0.0115}}}
  - {name: "{device_name}_color_frame", parent: "{device_name}_link", pose: {position: {y: 0.015}}}
  - {name: "{frame_id}", parent: "{device_name}_color_frame", pose: {orientation: {roll: -1.5707963268, yaw: -1.5707963268}}}
  - {name: "{device_name}_depth_frame", parent: "{device_name}_link"}
  - {name: "{device_name}_depth_optical_frame", parent: "{device_name}_depth_frame", pose: {orientation: {roll: -1.5707963268, yaw: -1.5707963268}}}
# --- end of generated block

components:
  - realsense_d415:
      camera: d415_color
      frame_id: "{frame_id}"

# Valid detection range (m) the `spawn_sensor` show_fov cone is drawn to (RealSense D415 datasheet
# min depth ~0.45 m; far is a display range -- a camera has no physical far).
fov:
  near: 0.45
  far: 6.0
