# Default capture plugin shipped with the mid360 mount.
#
# `spawn_sensor: {model: mid360}` pulls this in automatically, so a world does not re-declare the
# capture plugin. To override, declare livox_mid360 for the same mount in the world (it wins); to opt
# out, set spawn_sensor config `default_plugins: false`. `robot` is filled in from the spawn_sensor
# `name`. `exclude_body: mount` skips the sensor's own housing (a standalone mount has no chassis);
# `frame_id: livox_frame` matches Livox's own ROS driver.
components:
  - livox_mid360:
      site: mid360
      frame_id: livox_frame
      exclude_body: mount

# Field of view for `spawn_sensor: {show_fov: true}`. The Mid-360 is camera-less, so there is no
# `<camera>` to synthesise a frustum from and (since the baked CAD envelope was dropped) no bundled
# `_fov` mesh to reveal; instead spawn_sensor synthesises a translucent angular SECTOR from these
# datasheet angles. The angular band mirrors the `livox_mid360` capture plugin's own FoV defaults
# (a >= 2*pi azimuth span is a full 360deg dome); `near`/`far` are the shell's inner/outer radii.
# A world may override the drawn radii per placement via `fov_near`/`fov_range`.
fov:
  near: 0.1              # blind zone (m)
  far: 40.0             # datasheet detection range @ 10% reflectivity (m); 70 m @ 80%
  h_min: 0.0
  h_max: 6.283185307    # 2*pi -> full 360deg dome (azimuth wraps)
  v_min: -0.122173048   # -7 deg
  v_max: 0.907571211    # +52 deg
