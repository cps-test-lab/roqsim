# What the realsense_d435 mount ships with: the capture plugin, and the D435i's integrated IMU.
#
# `spawn_sensor: {model: realsense_d435}` pulls both in automatically, so a world does not re-declare
# them. To override one, declare it for the same mount in the world (it wins, and keeps this file's
# config for every key it does not restate); to drop one, `enabled: false` on that component; to opt
# out of all of them, set spawn_sensor config `default_plugins: false`. `robot` is filled in from the
# spawn_sensor `name`, and `prefix` is inherited from it.
#
# The mount is `camera_link` of the vendor macro `sensor_d435` (see realsense_d435.xml), nested in a
# robot manifest at that link's joint origin or placed on its own; spawn_sensor publishes the chain
# below from it. A second D435 on one carrier sets its own `device_name`, as a second instance of the
# macro sets its own `name`. Depth, when switched on, is rendered through `d435_color` -- the model
# has one camera -- and stamped in `{device_name}_depth_optical_frame` as realsense2_camera stamps
# it; the vendor puts that frame 15 mm from the colour frame along the baseline.

# --- generated by external/convert/build_realsense_devices.py from realsense2_description
# (urdf/_d435.urdf.xacro, nominal extrinsics). The macro's `name` param is the device name.
device_name: camera
frame_id: "{device_name}_color_optical_frame"
frames:
  - {name: "{device_name}_link", parent: mount}
  - {name: "{device_name}_color_frame", parent: "{device_name}_link", pos: [0, 0.015, 0]}
  - {name: "{frame_id}", parent: "{device_name}_color_frame", rpy: [-1.5707963268, 0, -1.5707963268]}
  - {name: "{device_name}_depth_frame", parent: "{device_name}_link", pos: [0, 0, 0]}
  - {name: "{device_name}_depth_optical_frame", parent: "{device_name}_depth_frame", rpy: [-1.5707963268, 0, -1.5707963268]}
  - {name: "{device_name}_gyro_frame", parent: "{device_name}_link", pos: [-0.01174, -0.00552, 0.0051]}
  - {name: "{device_name}_gyro_optical_frame", parent: "{device_name}_gyro_frame", rpy: [-1.5707963268, 0, -1.5707963268]}
  - {name: "{device_name}_imu_optical_frame", parent: "{device_name}_gyro_optical_frame"}
# --- end of generated block

components:
  - realsense_d435:
      camera: d435_color
      frame_id: "{frame_id}"
      depth_frame_id: "{device_name}_depth_optical_frame"

  # The D435i's integrated inertial module (BMI055). It is part of the DEVICE, so it arrives with the
  # model rather than being re-declared by every world that mounts one -- the same argument that puts
  # the capture plugin above in this manifest. The bundled model has always been the D435i: its FOV
  # and min-Z come from that datasheet and the plugin is named for it, so the IMU belongs here rather
  # than in a second model folder that would duplicate a vendored mesh and the camera pose with it.
  #
  # Two ways out, because the real driver streams the IMU only when asked (`enable_gyro` and
  # `enable_accel` default to false in realsense2_camera's own rs_launch.py):
  #   * nothing is computed while nothing subscribes -- the endpoint is lazy (see the imu plugin)
  #   * `enabled: false` on this component removes it, per world or as a campaign factor
  #     (components: {<mount>.imu: {enabled: false}})
  - imu:
      # At the vendor's gyro optical frame, which the chain above builds as a site of the mount:
      # _d435i_imu_modules.urdf.xacro co-locates accel and gyro at (-0.01174, -0.00552, 0.0051) in
      # camera_link with the optical rotation rpy (-pi/2, 0, -pi/2), and realsense2_camera stamps the
      # united stream in `<name>_imu_optical_frame`, coincident with it. This is the frame the
      # message is stamped in, so it has to be the frame the reading is measured in.
      site: "{device_name}_imu_optical_frame"
      frame_id: "{device_name}_imu_optical_frame"   # realsense2_camera constants.h / base_realsense_node.cpp
      # One fused message carrying both channels, which is what the driver publishes with
      # `unite_imu_method` set (its default of 0 leaves accel and gyro on separate topics instead).
      topic: camera/imu
      # 200 Hz: one of the D435i's supported gyro rates. Deliberately not "the driver's default" --
      # its gyro_fps/accel_fps default to 0, meaning "whatever the device picks", so there is no
      # number to copy. A world that reconstructs a specific run overrides it.
      rate_hz: 200.0
      # The hardware cannot report attitude: accelerometer + gyroscope, no magnetometer, and no
      # fusion on board -- so a real driver publishes orientation_covariance[0] = -1 and that is what
      # this must do. Turning it on would hand a stack a heading its sensor could not have measured,
      # which is the difference between a reconstruction and a flattering one.
      orientation: false

# Valid detection range (m) the `spawn_sensor` show_fov cone is drawn to, and what the coverage
# catalog reads for a hypothetical D435 placement.
fov:
  near: 0.28   # datasheet Min-Z at max resolution -- the same value realsense_d435 clips depth at.
  far: 6.0     # A DISPLAY / ANALYSIS range, deliberately NOT the plugin's clip_far (3.0): a colour
               # camera has no physical far. See coverage/catalog.py on tuning it per study.
