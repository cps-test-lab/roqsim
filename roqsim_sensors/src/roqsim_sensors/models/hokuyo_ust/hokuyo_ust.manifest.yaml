# Hokuyo UST-10LX 2D lidar, as a device `spawn_sensor` mounts -- on its own, or nested in a robot
# manifest at the vendor joint origin.
#
# Variant: Clearpath's `hokuyo_ust` accessory model covers the UST-10LX and UST-20LX
# (https://docs.clearpathrobotics.com/docs_robots/accessories/sensors/lidar_2d/hokuyo_ust10_lx/);
# the Ridgeback ships the UST-10LX as its standard forward lidar (Ridgeback user manual rev. 1.1.2,
# section 1.1, https://static.generation-robots.com/img/products/Ridgeback_UserManual_2016.pdf), and
# ridgeback_description names its mount `hokuyo_ust-10lx_mount`. This model is the UST-10LX.
#
# Mesh, link frames: Clearpath clearpath_sensors_description (see hokuyo_ust.xml). Scan values: Hokuyo
# "Scanning Laser Range Finder Smart-URG mini UST-10LX Specification", drawing C-42-04077, 2015-03-02,
# https://www.hokuyo-aut.jp/dl/UST-10LX_Specification.pdf ("spec").
#
# Frames, as Clearpath's macro chains them (hokuyo_ust.urdf.xacro:33-44 @ b0f6d92): the vendor joint
# origin places `<name>_link`, the base of the bracket, which is the mount body; the scan is stamped in
# `<name>_laser`, 0.0474 m above it. Clearpath names the sensor `lidar2d_<idx>` (clearpath_config
# sensors/types/lidars_2d.py and sensor.py @ b2a64ba), so the scan frame is `lidar2d_0_laser` for the
# first. The intermediate `<name>_link` is not published: its name follows the scanner's index, which
# only `{frame_id}` carries, and a fixed name would collide on a robot with two. spawn_sensor publishes
# `parent_frame -> {frame_id}` at the joint origin composed with the 0.0474 m.
#
# spawn_sensor fills `{frame_id}` from the mount's `frame_id`, else from the default below; a robot's
# second scanner names its own. `exclude_body: mount` skips this device's housing and nothing else;
# `emit_static_tf: false` because spawn_sensor publishes the `frames:` chain.
frame_id: lidar2d_0_laser   # Clearpath's first 2D lidar (lidars_2d.py get_frame_id_from_idx @ b2a64ba)

frames:
  - name: "{frame_id}"      # the vendor scan frame (hokuyo_ust.urdf.xacro:39-44 @ b0f6d92)
    parent: mount
    pos: [0.0, 0.0, 0.0474]
    rpy: [0.0, 0.0, 0.0]

components:
  - lidar:
      site: scan
      frame_id: "{frame_id}"
      exclude_body: mount
      emit_static_tf: false
      # What the driver publishes: ros-drivers/urg_node @ 936abce8cd (ros2-devel), src/urg_c_wrapper.cpp
      # ("driver"), with ros-drivers/urg_c @ 53136ab9cf, as Clearpath runs it (clearpath_robot
      # clearpath_sensors/launch/hokuyo_ust.launch.py @ 74362fc, params config/hokuyo_ust.yaml:
      # angle_min -3.14, angle_max 3.14, cluster 1).
      #
      # Layout: the requested window is converted to device steps, limited to the device's own
      # (urg_c current/src/urg_utils.c:153-156), and published as steps first..last with
      # angle_max = step2rad(last_step) (:207-209, :688-690, :791-823). Over the UST-10LX's 270 deg
      # that is 1081 rays (spec 2-2: "Measurement steps 1081", step 0..1080), 0.25 deg apart, the last
      # at +135 deg.
      rays: 1081
      angle_min: -2.356194490   # -135 deg
      angle_max: 2.356194490    # +135 deg
      # Header: the device's own DMIN / DMAX, read from the unit at connect (:212-213, :645-657;
      # urg_c current/src/urg_sensor.c:315-320). Taken as the spec's detection range 0.06 m to 10 m
      # (white Kent sheet); what the unit reports is unverified.
      range_min: 0.06           # unverified device DMIN; spec 4
      max_range: 10.0           # unverified device DMAX; spec 4
      # Physical limits: the device reports the error code 4 for x < 21 mm and 65533 for x > 30000 mm
      # (spec 5, "Measurement Data"); spec 4: max. detection distance 30 m.
      detection_min: 0.021
      detection_max: 30.0
      # urg_c passes the decoded value through (current/src/urg_sensor.c:542-544) and the driver
      # divides every non-zero value by 1000 (:241-249), so the error codes are published as metres:
      # too close 0.004 m, below range_min, and no return 65.533 m ("object does not exist or low
      # reflectivity"), above range_max. The codes are the spec's; not observed on hardware.
      too_close: 0.004          # spec 5 code 4 / 1000; unverified on hardware
      no_return: 65.533         # spec 5 code 65533 / 1000; unverified on hardware
      rate_hz: 40.0             # spec 4: scan speed 25 ms (motor speed 2400 rpm)
      # spec 4: repeated accuracy sigma < 30 mm (white Kent sheet), taken as 1 sigma. The +-40 mm
      # accuracy is a systematic bound and is not modelled. Clearpath's simulation has no noise.
      range_stddev: 0.03
      # Not modelled: a raw 0 the driver publishes as NaN (:247-248), which the spec lists no
      # condition for; intensities, which Clearpath leaves off (publish_intensity false); and the
      # spec's note that detection errors near an edge last one or two steps.

# Sector `spawn_sensor: {show_fov: true}` draws and the coverage catalog reads: the lidar's own
# field and its physical detection limits.
fov:
  near: 0.021
  far: 30.0
  h_min: -2.356194490
  h_max: 2.356194490
  v_min: 0.0
  v_max: 0.0
