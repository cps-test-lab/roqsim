# Slamtec RPLIDAR A1 (A1M8) 2D lidar, as a device `spawn_sensor` mounts -- on its own, or nested in a
# robot manifest at the vendor joint origin.
#
# Mesh, link frame and inertial: Clearpath turtlebot4_description (see rplidar_a1.xml). Scan values:
# Slamtec "RPLIDAR A1 Introduction and Datasheet, Model A1M8" rev 3.0, Figure 2-1 "RPLIDAR A1
# Performance" ("data sheet"), read from the copy at
# https://files.seeedstudio.com/products/114992561/LD108_SLAMTEC_rplidar_datasheet_A1M8_v3.0_en.pdf
#
# spawn_sensor fills `{frame_id}` from the mount's `frame_id`, else from the default below.
# `exclude_body: mount` skips this device's housing and nothing else; `emit_static_tf: false` because
# spawn_sensor publishes the `frames:` chain.
frame_id: rplidar_link      # the TurtleBot 4 link name

frames:
  - name: "{frame_id}"      # the vendor scan frame: the mount itself
    parent: mount
    pos: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

components:
  - lidar:
      site: scan
      frame_id: "{frame_id}"
      exclude_body: mount
      emit_static_tf: false
      # What the driver publishes: Slamtec/rplidar_ros @ 24cc9b6dea (branch ros2), src/rplidar_node.cpp
      # ("driver"), as the TurtleBot 4 launches it (turtlebot/turtlebot4_robot @ 28e115f
      # turtlebot4_bringup/launch/rplidar.launch.py: angle_compensate true, inverted false).
      #
      # Layout: with angle_compensate the scan is binned into 360 * m slots, m = 3 at the 8 kHz
      # sample rate and 10 Hz scan_frequency default (:324-327), so 1080 rays. The device limits
      # 0 .. 359 deg (:480-481) are published reversed as angle_min = pi - 359 deg, angle_max = pi,
      # angle_increment = (angle_max - angle_min) / (N - 1) (:245-253).
      rays: 1080
      angle_min: -3.124139361   # pi - 359 deg
      angle_max: 3.141592654    # pi
      # Header: range_min hard-coded 0.15 (:257); range_max is the scan mode's max_distance the device
      # reports, 12.0 m in a TurtleBot 4's log (Slamtec/rplidar_ros issue 129). Data sheet: distance
      # range 0.15-12 m, white objects, so the physical limits are the same numbers.
      range_min: 0.15
      max_range: 12.0
      # A sample the device reports as distance 0 is published +inf (:278-279), and every empty slot
      # stays +inf. Whether the A1 reports 0 or a raw distance for a surface nearer than 0.15 m is
      # unverified, so too_close keeps the REP 117 default.
      too_close: -inf           # unverified device output; REP 117 default
      no_return: +inf           # src/rplidar_node.cpp:278-279
      # Data sheet: scan rate 5.5 Hz typical (1 .. 10 Hz); the rate under the TurtleBot 4's fixed
      # motor PWM is unverified.
      rate_hz: 5.5
      # The data sheet gives no accuracy or statistical error, only distance resolution (< 0.5 mm
      # below 1.5 m, < 1% of the distance over the range), so no noise is applied. A world that has
      # a measured figure sets it.
      range_stddev: 0.0
      # Not modelled: the driver writes each sample into m consecutive slots, later samples
      # overwriting earlier ones (:494-501), and its slots are 1/3 deg while the header's increment
      # is 359 deg / 1079. Known driver defect, not modelled: intensities are read from the mirrored
      # index while ranges are not (:266 vs :282), so the intensity array runs backwards against the
      # ranges; this plugin publishes no intensities.

# Sector `spawn_sensor: {show_fov: true}` draws and the coverage catalog reads: the lidar's own
# field and its physical detection limits.
fov:
  near: 0.15
  far: 12.0
  h_min: -3.124139361
  h_max: 3.141592654
  v_min: 0.0
  v_max: 0.0
