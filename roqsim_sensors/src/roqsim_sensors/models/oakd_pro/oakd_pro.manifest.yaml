# Luxonis OAK-D Pro, as a device `spawn_sensor` mounts -- on its own, or nested in a robot manifest at
# the vendor joint origin of `<device_name>_link` (the TurtleBot 4 does).
#
# `spawn_sensor: {model: oakd_pro}` pulls the capture plugin in automatically, so a world does not
# re-declare it. To override, declare oakd_camera for the same mount (it wins, per key); to opt out,
# set spawn_sensor config `default_plugins: false`. `robot` is filled in from the spawn_sensor `name`.
#
# The mount is `oakd_link` of the vendor macro `oakd` (see oakd_pro.xml); spawn_sensor publishes the
# chain below from it. A second OAK-D on one carrier sets its own `device_name`.

# --- generated by external/convert/build_oakd_pro.py from turtlebot4_description
# (urdf/sensors/oakd.urdf.xacro). The macro's `name` param is the device name; the TurtleBot 4
# instantiates it with its default, `oakd`.
device_name: oakd
frame_id: "{device_name}_rgb_camera_optical_frame"
frames:
  - {name: "{device_name}_link", parent: mount}
  - {name: "{device_name}_rgb_camera_frame", parent: "{device_name}_link", pos: [0, 0, 0]}
  - {name: "{frame_id}", parent: "{device_name}_rgb_camera_frame", rpy: [-1.5707963268, 0, -1.5707963268]}
  - {name: "{device_name}_left_camera_frame", parent: "{device_name}_link", pos: [0, 0.0375, 0]}
  - {name: "{device_name}_left_camera_optical_frame", parent: "{device_name}_left_camera_frame", rpy: [-1.5707963268, 0, -1.5707963268]}
  - {name: "{device_name}_right_camera_frame", parent: "{device_name}_link", pos: [0, -0.0375, 0]}
  - {name: "{device_name}_right_camera_optical_frame", parent: "{device_name}_right_camera_frame", rpy: [-1.5707963268, 0, -1.5707963268]}
  - {name: "{device_name}_imu_frame", parent: "{device_name}_link", pos: [0, 0, 0], rpy: [-1.5707963268, 0, -1.5707963268]}
# --- end of generated block

components:
  - oakd_camera:
      camera: oakd_rgb
      frame_id: "{frame_id}"

# Valid detection range (m) the `spawn_sensor` show_fov cone is drawn to, and what the coverage
# catalog reads for a hypothetical OAK-D placement.
fov:
  near: 0.3    # the source URDF's Gazebo clip near, which is also oakd_camera's clip_near.
  far: 8.0     # A DISPLAY / ANALYSIS range, deliberately NOT the plugin's clip_far (100.0, the
               # URDF's own far): a colour camera has no physical far, and a 100 m cone drawn in a
               # room is useless. Luxonis quotes an ideal depth range to 12 m. See
               # coverage/catalog.py on tuning it per study.
