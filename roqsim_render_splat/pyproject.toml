[build-system]
requires = ["setuptools>=64", "wheel"]
# setuptools.build_meta, with the setuptools `requires` states even where an installer without
# build isolation offers an older one (_build/roqsim_build_backend.py).
build-backend = "roqsim_build_backend"
backend-path = ["_build"]

[project]
name = "roqsim_render_splat"
version = "0.1.0"
description = "A Gaussian-splat renderer for roqsim: a captured room as every camera sees it, the robots drawn into it by depth."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "roqsim",
    "numpy>=1.24",
    # The rasteriser: gsplat is Apache-2.0. The reference 3DGS rasteriser (Inria) is licensed for
    # non-commercial research only, so it is never a dependency and never imported.
    "gsplat>=1.5,<2",
    # gsplat draws on CUDA; a CUDA build of torch is what makes the renderer open. The CPU wheel
    # installs, and the renderer then refuses to open, naming the missing GPU.
    "torch>=2.1",
    "pyyaml>=6.0",
    # `roqsim splat collision` labels the furniture patches it fits boxes to.
    "scipy>=1.11",
    # The example world's robot, so the example runs as installed.
    "roqsim_mobile",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.entry-points."roqsim.renderers"]
splat = "roqsim_render_splat.renderer:SplatRenderer"

[project.entry-points."roqsim.commands"]
splat = "roqsim_render_splat.cli:splat"

[project.entry-points."roqsim.worlds"]
roqsim_render_splat = "roqsim_render_splat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roqsim_render_splat = [
    "worlds/*.yaml",
    "worlds/*/*.ply",
    "worlds/*/*.xml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
