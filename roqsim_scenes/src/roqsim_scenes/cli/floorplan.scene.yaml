# Shared bake config for every floorplan generated by floorplan_to_world.py (read by scene_to_mjcf.py
# via --config). It gives generated walls/floor one consistent look/collision/lighting
# -- the plastered-wall texture, a collidable ground plane, and the overhead light + ambient fill --
# so every generated room matches the reference scene without copying a scene.yaml per room.
#
# The generator names its objects `Wall_NN` and `Floor`, which the globs below match. Generated OBJs
# carry no UVs, so the textures auto-project (texuniform); physical_size sets the real-world tile scale.

collision: convex        # per-object convex hull colliders (each wall is a solid slab) | none
ground_plane: true       # flat collidable floor at z ~ 0 under the visible Floor mesh
origin: [0, 0, 0]

materials:               # texture objects by name glob (first match wins); rgba tints, RGB >1 brightens
  - match: "Floor"
    texture: roqsim_assets:PlasteredWall04
    rgba: [1.7, 1.7, 1.7, 1.0]
    physical_size: 10
  - match: "Wall*"
    texture: roqsim_assets:PlasteredWall04
    rgba: [2.2, 2.2, 2.2, 1.0]
  # Only present when generated with --ceiling; harmless otherwise (materials match by object name).
  - match: "Ceiling"
    texture: roqsim_assets:Concrete046
    rgba: [1.3, 1.3, 1.3, 1.0]
    physical_size: 2.4

light:                   # a single hemispherical overhead light + a global ambient fill
  height: 4.0
  diffuse: [0.4, 0.4, 0.4]
  cutoff: 90.0
  fill: [0.3, 0.3, 0.3]
