# A sliding door that opens for a robot coming near and closes behind it, once.
#
#   roqsim sim roqsim_assets/src/roqsim_assets/worlds/sliding_door_demo.yaml
#
# The door is a machine (`sliding_door`): it opens and closes. The zone before it (`zone_trigger`)
# reports who is near; it counts entities named robot_*. The robot is a box driven along a straight
# line (`moving_box`) that passes the door through the zone and goes on. The scenario
# (`DoorForWhoComes`) relates the two: it opens the door when the robot enters the zone, closes it
# two seconds after the robot has left, and ends -- one cycle.
#
# smoke-steps: 4500

sim:
  pacing: realtime

components:
  - sliding_door:
      prefix: door_1_
      pose: {position: {x: 0.0, y: 1.0}, orientation: {yaw: 0.0}}
      width: 1.2
      speed: 1.2
    name: door_1

  - zone_trigger:
      pose: {position: {x: 0.0, y: 0.0, z: 0.25}}
      size: [1.5, 1.0, 1.0]
      entities: [robot_*]
    name: door_approach

  - moving_box:
      prefix: robot_1_
      size: [0.4, 0.4, 0.5]
      pose: {position: {x: -2.0, y: 0.0}}
      speed: 2.0
      waypoints: [[3.0, 0.0]]
      loop: false
      collide: false
      color: [0.2, 0.45, 0.8, 1.0]
    name: robot_1

  - "roqsim_assets.scenarios.door_for_who_comes:DoorForWhoComes":
      close_delay: 2.0
    name: doorman
