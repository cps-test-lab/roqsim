# A light barrier at a conveyor's end, and a belt that stops while a part is in it.
#
#   roqsim sim roqsim_assets/src/roqsim_assets/worlds/light_barrier_demo.yaml
#
# The belt is a machine (`conveyor`): it runs at a speed and stops. The barrier is a `zone_trigger`
# across the belt near its discharge end, between two posts, as deep as a package so a part that
# broke the beam is still in it when the belt has stopped; it reports the package entering and
# leaving. The scenario (`StopAtBarrier`) stops the belt while the package is in the barrier --
# a decision neither the belt nor the barrier makes -- and, playing the worker, takes the package
# off the belt a second later; the belt runs again and the scene ends, one cycle, and so does the
# run. The package starts just before the barrier, so the cycle is short.
#
# smoke-steps: 2500

sim:
  pacing: realtime

components:
  - spawn_model:
      model: industrial_table
      pose: {position: {x: -0.13, y: 0.6, z: 0.0}}
    name: table

  - conveyor:
      speed: 0.2
      ramp: 0.5
      package_pose: {position: {x: -0.5, y: 0.6, z: 0.996}}   # the belt's frame: 0.4 m before the barrier
    name: belt

  - box:
      prefix: post_a_
      pose: {position: {x: -0.9, y: 0.38, z: 1.05}}
      size: [0.04, 0.04, 0.22]
      color: [0.95, 0.75, 0.05, 1.0]
      collide: false
      motion: static
    name: post_a

  - box:
      prefix: post_b_
      pose: {position: {x: -0.9, y: 0.82, z: 1.05}}
      size: [0.04, 0.04, 0.22]
      color: [0.95, 0.75, 0.05, 1.0]
      collide: false
      motion: static
    name: post_b

  - zone_trigger:
      pose: {position: {x: -0.9, y: 0.6, z: 1.0}}
      size: [0.12, 0.2, 0.08]   # as deep as a package: a part that broke the beam is in it while the belt stops
      entities: [package]
    name: belt_end

  - "roqsim_assets.scenarios.stop_at_barrier:StopAtBarrier":
      hold: 1.0
      take_to: {position: {x: -0.13, y: 0.0, z: 0.9}}   # on the table, beside the belt
      stop_at_end: true
    name: barrier_stop
