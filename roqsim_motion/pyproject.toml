[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roqsim_motion"
version = "0.1.0"
description = "One motion core for roqsim's humanoids: whole-body IK, hands, and moves started through a handle."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "roqsim",
    "roqsim_nav",   # the way a body holding something walks (lattice, footprint)
    "mujoco>=4.0,<4.1",
    "numpy>=1.24",
    "scipy>=1.11",  # Euler decomposition of a rotation (quat.py)
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.entry-points."roqsim.plugins"]
# A humanoid's moves, on the body of the walker it is nested under.
humanoid = "roqsim_motion.moves:HumanoidPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
