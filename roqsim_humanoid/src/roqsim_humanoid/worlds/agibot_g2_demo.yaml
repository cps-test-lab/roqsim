# AgiBot Genie G2 in an empty room — standalone demo world (roqsim_humanoid).
#
# Watch it drive:  roqsim sim roqsim_humanoid/src/roqsim_humanoid/worlds/agibot_g2_demo.yaml
# Pose by hand:    roqsim sim .../agibot_g2_demo.yaml --manual-control   (viewer sliders own every
#                  actuator: drive the wheels, lift the torso, wave an arm, close a gripper)
#
# diff_drive (planar skid-steer over the 4 wheel roll actuators), agibot_g2_controller (torso/head/
# arm/gripper position hold) and the 2D lidar all come from the g2 model manifest
# (models/agibot_g2.manifest.yaml). A `test_cmd` drives a gentle arc so the standalone scene shows
# motion. For ROS 2 / nav2, add a ros2_bridge and drive /cmd_vel (see roqsim_ros_bridge).

sim:
  pacing: realtime      # realtime | asap | {factor: N}

plugins:
  - spawn_robot:
      model: agibot_g2
      name: robot
      pos: [0.0, 0.0]
      yaw: 0.0

  # Override the manifest's diff_drive only to add test_cmd: with no ROS to send /cmd_vel, this
  # scripted [v, w] drives a gentle arc (well inside the 0.5 m/s / 0.6 rad/s limits). In-place
  # rotation is scrub-limited, so this uses forward + mild turn.
  - diff_drive:
      robot: robot
      test_cmd: [0.3, 0.2]   # remove once the ros2_bridge drives /cmd_vel

  # For ROS 2 (colcon package roqsim_ros_bridge): one bridge reads every declared endpoint from
  # ctx.interface -- cmd_vel/odom/joint_states/joint_command/scan -- no per-topic config needed.
  # - ros2_bridge: {}
