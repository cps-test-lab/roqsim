# Default controller + sensors shipped with the LimX Oli (HU_D04_01) robot description.
#
# `spawn_robot: {model: oli}` pulls these in automatically (via SpawnRobotPlugin.expand ->
# expand_manifest), so a world does not re-declare the robot's intrinsic locomotion/sensors. To
# override a default, declare the same plugin for the same robot in the world; to opt out entirely,
# set `spawn_robot` config `default_plugins: false`. Each entry's `robot` is filled in from the
# spawn_robot `name`.
#
# The world MUST set `sim.timestep: 0.001` -- oli_locomotion's PD loop / decimation are tuned for a
# 1000 Hz step / 100 Hz policy (see worlds/*oli*.yaml), exactly as the vendor deploy code runs.
#
# lidar comes from roqsim_sensors (a dependency of this package) -- borrowed by name so the Oli
# publishes /scan for nav2 exactly like the turtlebot/G1 do. The two depth cameras are the Oli's
# real head + chest RealSense D435s: the `realsense_d435` device model, mounted twice below, each with
# its own device_name and namespace so their frames and topics don't collide.

# The models directory is flat, so the licence this model carries is named rather than guessed
# from what sits beside it: the Oli description is LimX Dynamics' (Apache-2.0, THIRD_PARTY.md).
license: LICENSE.limx_oli

components:
  - oli_locomotion: {}                             # ONNX whole-body walk policy + PD; config bundled
  - lidar:
      site: lidar
      rays: 360
      max_range: 12.0
  # The head and chest RealSense D435s, as the `realsense_d435` device mounted by its vendor
  # camera_link. `parent_frame` is a moving body; the device's own chain stays rigid on it.
  #
  # Where they sit, from HU_D04_01.urdf @ humanoid-description a90f734 (whose camera joints are both
  # inside one commented-out block, :2063-2091): head_camera_joint on head_pitch_link at
  # xyz (0.07453, 0.0175, 0.065), rpy (0, 1.5708, 0). The link carries the vendor's d435_link.STL at
  # identity, and that mesh's axes say what the link is: its lens normal is +z, its long (baseline)
  # axis +y, and its origin is 4.2 mm behind the glass and 17.5 mm from the housing centre -- the
  # D435's depth origin, which is realsense camera_link's. So head_camera_link is camera_link pitched
  # +90 deg (z forward, y along the baseline), and the rpy undoes itself: camera_link sits at the
  # joint origin with head_pitch_link's own orientation, looking forward, upright.
  #
  # waist_camera_joint (rpy 0, 2.1818, 0 on waist_pitch_link, read the same way a 35 deg downward
  # tilt) is recorded as a deviation: the chest camera keeps the forward axis at the joint origin.
  #
  # Each also brings the D435i's IMU (lazy, on `<namespace>/camera/imu`): the real module has one.
  # `fovy: 58` is the D435's depth vertical FOV, the stream this port renders for.
  - spawn_sensor:
      model: realsense_d435
      parent_frame: head_pitch_link
      pos: [0.07453, 0.0175, 0.065]
      rpy: [0.0, 0.0, 0.0]
      device_name: head_camera
      namespace: head_camera
    name: head_camera
    components:
      - realsense_d435: {points: true, fovy: 58.0}
  - spawn_sensor:
      model: realsense_d435
      parent_frame: waist_pitch_link
      pos: [0.092, 0.0175, 0.2751]
      rpy: [0.0, 0.0, 0.0]
      device_name: chest_camera
      namespace: chest_camera
    name: chest_camera
    components:
      - realsense_d435: {points: true, fovy: 58.0}
