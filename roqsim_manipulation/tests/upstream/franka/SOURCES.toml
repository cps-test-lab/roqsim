  "franka_msgs/msg/FrankaRobotState.msg",
]

# `robots/fr3/fr3.urdf.xacro hand:=false`, processed by xacro: the arm without the Franka Hand, under
# franka_description's names (fr3_link0..8, fr3_joint1..7), the names franka_ros2 uses.
[[generated]]
dir = "franka_description"
file = "fr3.urdf"
xacro = "robots/fr3/fr3.urdf.xacro"
mappings = { hand = "false" }

# The same with `no_prefix:=true` (link0..8, joint1..7): the names libfranka's Model looks up in the
# URDF the robot serves (src/robot_model.h, kLastLinkName "link8"), so the one the simulated robot
# serves through GetRobotModel.
[[generated]]
dir = "franka_description"
file = "fr3_no_prefix.urdf"
xacro = "robots/fr3/fr3.urdf.xacro"
mappings = { hand = "false", no_prefix = "true" }

