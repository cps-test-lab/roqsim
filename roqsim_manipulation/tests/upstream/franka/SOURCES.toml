# The Franka upstream files roqsim's simulated FR3 is built from and checked against, at the commits
# it is held to. Fetched and checked by external/franka_upstream.py;
# never edited by hand. Each directory carries its repository's LICENSE (Apache-2.0).
#
# The pins: libfranka 0.21.3 (needs FR3 system >= 5.9.0, robot server version 10), the
# libfranka-common commit it pins as its `common` submodule (the FCI wire format, kVersion 10),
# franka_description 2.9.0 and franka_ros2 v3.6.1 (Jazzy), the pair each compatibility table names.

[[repo]]
dir = "libfranka"
url = "https://github.com/frankarobotics/libfranka"
tag = "0.21.3"
commit = "85912fe02258d8cb811d3eff1f11e52ce89e3217"
license = "Apache-2.0"
files = [
  "LICENSE",
  "include/franka/rate_limiting.h",
  "include/franka/robot.h",
  "include/franka/errors.h",
  "include/franka/robot_state.h",
  "src/joint_velocity_limits.cpp",
  "src/errors.cpp",
  "examples/generate_joint_position_motion.cpp",
  "examples/examples_common.cpp",
  "docs/compatibility_matrix.rst",
]

[[repo]]
dir = "libfranka-common"
url = "https://github.com/frankarobotics/libfranka-common"
tag = "(libfranka 0.21.3's common submodule)"
commit = "2e090a65e51c94a98f9fc82b6ec3d1aa54d0f85f"
license = "Apache-2.0"
files = [
  "LICENSE",
  "include/research_interface/robot/service_types.h",
  "include/research_interface/robot/rbk_types.h",
  "include/research_interface/robot/error.h",
]

[[repo]]
dir = "franka_description"
url = "https://github.com/frankarobotics/franka_description"
tag = "2.9.0"
commit = "7aeeddc449edf8d62b594f9e36a81da53e7796f9"
license = "Apache-2.0"
files = [
  "LICENSE",
  "robots/fr3/joint_limits.yaml",
  "robots/fr3/dynamics.yaml",
]

[[repo]]
dir = "franka_ros2"
url = "https://github.com/frankarobotics/franka_ros2"
tag = "v3.6.1"
commit = "8c946641bdedaf20c35604d8bc5a809117e4ed6c"
license = "Apache-2.0"
files = [
  "LICENSE",
  "franka_ros2/doc/compatibility_matrix.rst",
]

# `robots/fr3/fr3.urdf.xacro hand:=false`, processed by xacro: the arm without the Franka Hand, under
# franka_description's names (fr3_link0..8, fr3_joint1..7), the names franka_ros2 uses.
[[generated]]
dir = "franka_description"
file = "fr3.urdf"
xacro = "robots/fr3/fr3.urdf.xacro"
mappings = { hand = "false" }

# The same with `no_prefix:=true` (link0..8, joint1..7): the names libfranka's Model looks up in the
# URDF the robot serves (src/robot_model.h, kLastLinkName "link8"), so the one the simulated robot
# serves through GetRobotModel.
[[generated]]
dir = "franka_description"
file = "fr3_no_prefix.urdf"
xacro = "robots/fr3/fr3.urdf.xacro"
mappings = { hand = "false", no_prefix = "true" }
serve = "roqsim_manipulation_assets/src/roqsim_manipulation_assets/models/fr3/fr3.robot_model.urdf"

# What the converted visual meshes are held to (visual_digest in external/franka_upstream.py):
# per primitive of each DAE, in file order, its material and colours, triangle count, bounds, open
# edges and area-weighted normal. The DAE files themselves are too large to vendor.
[[digest]]
dir = "franka_description"
file = "fr3_visual.json"
meshes = [
  "meshes/robots/fr3/visual/link0.dae",
  "meshes/robots/fr3/visual/link1.dae",
  "meshes/robots/fr3/visual/link2.dae",
  "meshes/robots/fr3/visual/link3.dae",
  "meshes/robots/fr3/visual/link4.dae",
  "meshes/robots/fr3/visual/link5.dae",
  "meshes/robots/fr3/visual/link6.dae",
  "meshes/robots/fr3/visual/link7.dae",
]

