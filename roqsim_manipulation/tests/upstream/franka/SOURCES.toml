# The Franka upstream files the test_franka* tests read, at the commits roqsim's simulated FR3 is
# held to. Fetched and checked by `roqsim arm franka-upstream` (roqsim_manipulation.cli.franka_upstream);
# never edited by hand. Each directory carries its repository's LICENSE (Apache-2.0).
#
# The pins: libfranka 0.21.3 (needs FR3 system >= 5.9.0, robot server version 10), the
# libfranka-common commit it pins as its `common` submodule (the FCI wire format, kVersion 10),
# franka_description 2.9.0 and franka_ros2 v3.6.1 (Jazzy), the pair each compatibility table names.

[[repo]]
dir = "libfranka"
url = "https://github.com/frankarobotics/libfranka"
tag = "0.21.3"
commit = "85912fe02258d8cb811d3eff1f11e52ce89e3217"
license = "Apache-2.0"
files = [
  "LICENSE",
  "include/franka/rate_limiting.h",
  "include/franka/lowpass_filter.h",
  "include/franka/robot_state.h",
  "include/franka/errors.h",
  "include/franka/control_types.h",
  "include/franka/robot.h",
  "src/joint_velocity_limits.cpp",
  "src/errors.cpp",
  "examples/generate_joint_position_motion.cpp",
  "examples/examples_common.cpp",
  "docs/compatibility_matrix.rst",
]

[[repo]]
