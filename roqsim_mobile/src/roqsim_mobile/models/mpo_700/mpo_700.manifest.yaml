# Default controller + sensors for the Neobotix MPO-700 swerve base.
#
# `spawn_robot: {model: mpo_700}` pulls these in automatically, so a world does not re-declare the
# robot's intrinsic kinematics/sensors.
components:
  # HOLONOMIC via four INDEPENDENTLY STEERED wheels -- the substrate's first swerve base. It uses
  # omni_drive like the ridgeback and lgdxrobot2, because a swerve base is holonomic and the planar
  # drive is unchanged; what differs is that the wheels must be AIMED, which is the swerve inverse
  # kinematics `steer_joints`/`steer_actuators` select. No slip_factor: it does not turn by scrubbing.
  #
  # The steering is OBSERVATIONAL, like every other wheel treatment here -- geometrically right, and
  # not the motive force. A paper measuring steer rate limits or the reorientation delay at a
  # direction change needs real steer actuation, which this is not. See the port log.
  - omni_drive:
      base_joint: base_free
      vx_actuator: base_vx
      vy_actuator: base_vy
      wz_actuator: base_wz
      # The vendor's own Nav2 profile (configs/mpo_700/navigation.yaml), not a datasheet figure.
      # Note it is NOT isotropic: 0.8 forward against 0.5 sideways. A holonomic base need not strafe
      # as fast as it drives, and assuming it does would have overstated this platform by 60%.
      max_linear_vel: 0.8            # max_vel_x
      max_lateral_vel: 0.5           # max_vel_y
      max_combined_linear_vel: 0.8   # cap on hypot(vx, vy)
      max_angular_vel: 0.8           # OURS: their profile states no max_vel_theta, so this
                                     # borrows the magnitude of acc_lim_theta. An assumption.
      accel_limit: 0.25              # acc_lim_x / acc_lim_y
      angular_accel_limit: 0.8       # acc_lim_theta
      # Geometry from the expanded xacro: wheel sphere radius 0.09, steering axes at (+-0.24, +-0.18).
      wheel_radius: 0.09
      wheel_separation: 0.36         # lateral, 2 x 0.18
      axis_separation: 0.48          # longitudinal, 2 x 0.24
      wheels: [mpo_700_wheel_front_left, mpo_700_wheel_front_right,
               mpo_700_wheel_back_left, mpo_700_wheel_back_right]
      wheel_actuators: [wheel_front_left_motor, wheel_front_right_motor,
                        wheel_back_left_motor, wheel_back_right_motor]
      steer_joints: [mpo_700_caster_front_left_joint, mpo_700_caster_front_right_joint,
                     mpo_700_caster_back_left_joint, mpo_700_caster_back_right_joint]
      steer_actuators: [steer_front_left, steer_front_right, steer_back_left, steer_back_right]
  # TWO SICK S300s, diagonally opposite, which is what the vendor ships. Neither covers 360 degrees
  # alone; together they see around the robot. A single centre-mounted 360 scan would have been
  # simpler and would have given the robot a sensor it does not have, with no blind corners.
  #
  # Each is the `sick_s300` device model at the vendor's joint rotation (neo_simulation2 @ 8320414,
  # robots/mpo_700/urdf/mpo_700_body.urdf.xacro, lidar_1_joint :36-41 and lidar_2_joint :63-68).
  # Both hang upside down (roll 3.14) and face out of their corners (yaw 0.79 front-left, 3.93
  # rear-right); the values are kept as the vendor writes them. Field, rays, range, rate and noise are
  # the device's datasheet values. The vendor's Gazebo sensors (720 rays over +-1.48 rad at 40 Hz,
  # sigma 0.01, mpo_700_gazebo.urdf.xacro:25-50) come from a macro whose noise comment derives the
  # value for a Hokuyo (components/common_macro/gazebo_lidar_macro.xacro:41-44) and which the
  # MPO-500's microScan3s share, so none is a value for the S300 on this robot and none is copied;
  # their topics are the robot's ROS interface and are: one topic per scanner, `scan` and `scan2`.
  #
  # POSE: Neobotix's hardware documentation, not the description's joint xyz. The MPO-700 "Mechanical
  # Properties" page (https://neobotix-docs.de/hardware/en/platforms/mpo-700/mechanical.html, Positions
  # of Sensors) puts the optional diagonal scanners at X +-327, Y +-277, Z 201.5 mm in the platform frame.
  #
  # HEIGHT (applied): Z is the height of the scan plane above the floor (the same table's centre
  # scanners are Z 181, "Height of scan plane"). The page's wheels are 180 mm across (D) and the
  # description's wheel centres sit 0.10 above base_link, so base_link is 10 mm below the floor and the
  # plane is at z 0.2115. The sick_s300 device casts 4.1 mm above its frame on these upside-down mounts,
  # so the frame is at z 0.2074. The description writes 0.223.
  #
  # X, Y (applied): the page measures X +-327 / Y +-277 from the platform centre, which the
  # description's steering axes (+-0.24, +-0.18) share, so they apply unchanged in base_link; the
  # description's joints write +-0.338 / +-0.288, 11 mm further out on each axis. There the sick_s300
  # device, which collides as the convex hulls of its housing block and optics head, clears the corner
  # wheel by 7 mm at every steer angle -- see the port log.
  #
  # The wheels collide as the same page's 30 mm wide wheel (B), not the vendor's 180 mm tyre sphere,
  # which reaches the housings even at this pose; test_mpo_700_scene.py asserts no housing touches a tyre.
  - spawn_sensor:
      model: sick_s300
      parent_frame: base_link
      pos: [0.327, 0.277, 0.2074]    # Neobotix MPO-700 Positions of Sensors; see X, Y and HEIGHT
      rpy: [3.14, 0.0, 0.79]         # mpo_700_body.urdf.xacro:38, lidar_1_joint origin rpy
      frame_id: lidar_1_link         # mpo_700_gazebo.urdf.xacro:27, the link the scan is stamped in
    name: scan_front
    components:
      - lidar:
          topics: {scan: scan}       # mpo_700_gazebo.urdf.xacro:36; relative, so the namespace scopes it
  - spawn_sensor:
      model: sick_s300
      parent_frame: base_link
      pos: [-0.327, -0.277, 0.2074]  # Neobotix MPO-700 Positions of Sensors; see X, Y and HEIGHT
      rpy: [3.14, 0.0, 3.93]         # mpo_700_body.urdf.xacro:65, lidar_2_joint origin rpy
      frame_id: lidar_2_link         # mpo_700_gazebo.urdf.xacro:41
    name: scan_rear
    components:
      - lidar:
          topics: {scan: scan2}      # mpo_700_gazebo.urdf.xacro:50
