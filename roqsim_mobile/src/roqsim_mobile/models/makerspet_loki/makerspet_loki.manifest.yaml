# Default controller + sensors for the Maker's Pet Loki (200 mm 3D-printed pet robot).
#
# `spawn_robot: {model: makerspet_loki}` pulls these in automatically, so a world does not
# re-declare the robot's intrinsic kinematics/sensors.
components:
  # A TRUE two-wheel differential drive with a modelled caster -- so no slip_factor, the same line
  # turtlebot3_waffle, raspimouse and oomwoo_one draw. It does not turn by scrubbing.
  - diff_drive:
      wheel_radius: 0.0335           # the description's wheel_diameter 0.067
      wheel_separation: 0.159063     # the description's wheel_base, and the URDF geometry agrees
      max_linear_vel: 0.26           # config/navigation.yaml max_vel_x
      max_angular_vel: 1.0           # config/navigation.yaml max_vel_theta
      wheel_accel_limit: 2.5         # config/navigation.yaml acc_lim_x
      left_actuators:  [wheel_left_motor]
      right_actuators: [wheel_right_motor]
      left_joints:  [wheel_left_joint]
      right_joints: [wheel_right_joint]
  # MOUNT is the vendor's -- the description's scan_joint, 0.13135 m above base_link, with the puck
  # INVERTED (rpy -pi) so a 360 degree scanner fits under the head. The SCAN is not: unlike
  # oomwoo_one, the jazzy branch ships no Gazebo sensor block and no SDF, and Kaia.ai supports
  # several LDS models, so which scanner a build carries is a deployment choice. These are LDS-01
  # class values -- see the port log, where this is the port's one real assumption.
  - lidar:
      site: lidar
      frame_id: laser
      rays: 360
      angle_min: 0.0
      angle_max: 6.283185307
      range_min: 0.12
      max_range: 3.5
      rate_hz: 5.0
      exclude_body: base_link
