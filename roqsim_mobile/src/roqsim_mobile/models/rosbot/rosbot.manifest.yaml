# Default controller + sensors shipped with the Husarion ROSbot description.
#
# `spawn_robot: {model: rosbot}` pulls these in automatically, so a world does not re-declare the
# robot's intrinsic kinematics/sensors. To override a default, nest an entry with the same LABEL
# under that spawn_robot's `components:`; to opt out entirely, set `spawn_robot` config
# `default_plugins: false`.
components:
  # 4-wheel skid-steer, left pair and right pair commanded together -- the husky_a200 /
  # clearpath_jackal class, and it needs the same slip_factor for the same reason: MuJoCo point
  # contacts reproduce lateral scrub badly, so without it the base yaws at a fraction of what was
  # commanded and a planner cannot rotate. Values below are Husarion's own published controller
  # config (rosbot_controller/config/rosbot/controllers.yaml) except where noted.
  - diff_drive:
      wheel_radius: 0.0425           # controllers.yaml, and it matches the wheel mesh (0.0839 dia)
      wheel_separation: 0.186        # controllers.yaml. NOTE: the URDF geometry gives 0.192
                                     # (2 x 0.096); the vendor's controller uses the smaller value,
                                     # which is the one their odometry is calibrated against.
      max_linear_vel: 1.1            # controllers.yaml max linear velocity
      max_angular_vel: 3.14          # controllers.yaml max angular velocity
      wheel_accel_limit: 1.2         # controllers.yaml max linear acceleration
      # Skid-steer ICR slip compensation, calibrated against THIS model's wheel friction, mass and
      # timestep -- without it the base yaws at ~66% of commanded and a planner under-rotates.
      # chi=1.5 -> achieved/commanded 0.995/0.978/1.004/1.003 at w = 0.3/0.5/0.8/1.0 rad/s.
      # Much smaller than husky_a200's 3.0: this chassis is short (0.106 m wheelbase) relative to its
      # 0.192 m track, so it scrubs far less. Re-measure if friction, actuator kv, mass or timestep
      # change. See the port log.
      slip_factor: 1.5
      left_actuators:  [fl_wheel_motor, rl_wheel_motor]
      right_actuators: [fr_wheel_motor, rr_wheel_motor]
      left_joints:  [fl_wheel_joint, rl_wheel_joint]
      right_joints: [fr_wheel_joint, rr_wheel_joint]
  # The scanner Husarion's default configuration mounts: an RPLIDAR C1 on cover_link at xyz
  # (0.02, 0, 0), rpy 0 (rosbot_description config/rosbot/basic.yaml:4-7 @ 41fad02, the default
  # `components_config` of urdf/rosbot.urdf.xacro). The device model carries the datasheet values and
  # the vendor chain rplidar_link -> laser; Husarion builds it with use_tf_prefix False, so the scan
  # frame is the bare `laser`. The C1 skips only its own housing, so the camera-mount post of the
  # body mesh beside it is a real return -- see the port log.
  - spawn_sensor:
      model: rplidar_c1
      parent_frame: cover_link
      pos: [0.02, 0.0, 0.0]         # basic.yaml:6 @ 41fad02
      rpy: [0.0, 0.0, 0.0]          # basic.yaml:7 @ 41fad02
      frame_id: laser               # slamtec_rplidar.urdf.xacro:278 @ 5f783f8, empty component name
    name: rplidar
    components:
      - lidar:
          # Husarion's value for the C1 on this robot: its C1 block states std_dev 0.02 m
          # (slamtec_rplidar.urdf.xacro:126 @ 5f783f8), where the device takes the data sheet's
          # +-30 mm accuracy as 1 sigma.
          range_stddev: 0.02
          # Relative, so the robot's namespace scopes it: `<ns>/scan` (slamtec_rplidar.urdf.xacro:286).
          topics: {scan: scan}

# Fixed links the vendor chains and this MJCF flattens into body_link, which a device hangs from.
frames:
  # rosbot_description urdf/rosbot/body.urdf.xacro:39-43 @ 41fad02 (body_to_cover_joint).
  - {name: cover_link, parent: body_link, pos: [0.0, 0.0, 0.0603], rpy: [0.0, 0.0, 0.0]}
