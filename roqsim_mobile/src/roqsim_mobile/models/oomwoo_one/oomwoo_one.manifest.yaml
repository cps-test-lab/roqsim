# Default controller + sensors for the OOMWOO One open-source robot vacuum.
#
# `spawn_robot: {model: oomwoo_one}` pulls these in automatically, so a world does not re-declare
# the robot's intrinsic kinematics/sensors.
#
# Unusually, NOTHING here is an assumption: every value is the description's own, from
# makerspet/oomwoo-one @ 5305e6c5 (urdf/params.xacro, urdf/plugins.xacro, config/navigation.yaml).
# Every other mobile port in this batch had to invent at least a scanner mount height.
components:
  # A TRUE two-wheel differential drive with a modelled caster -- so no slip_factor, the same line
  # turtlebot3_waffle and raspimouse draw. It does not turn by scrubbing.
  - diff_drive:
      wheel_radius: 0.034            # params.xacro wheel_diameter 0.068
      wheel_separation: 0.235        # params.xacro wheel_base, and the URDF geometry agrees
      max_linear_vel: 0.2            # config/navigation.yaml max_vel_x
      max_angular_vel: 0.8           # config/navigation.yaml max_vel_theta
      wheel_accel_limit: 1.0         # params.xacro max_linear_acceleration
      left_actuators:  [wheel_left_motor]
      right_actuators: [wheel_right_motor]
      left_joints:  [wheel_left_joint]
      right_joints: [wheel_right_joint]
  # The vendor's own scan, from plugins.xacro's laser_scan_sensor: 360 samples over a full turn,
  # 0.1-10 m, 5 Hz. The mount height is the description's scan_joint, not a guess -- 0.088 m above
  # the floor, which is low, as a vacuum's must be to fit under furniture.
  - lidar:
      site: lidar
      frame_id: laser
      rays: 360
      angle_min: 0.0
      angle_max: 6.283185307
      range_min: 0.1
      max_range: 10.0
      rate_hz: 5.0
      exclude_body: base_link
