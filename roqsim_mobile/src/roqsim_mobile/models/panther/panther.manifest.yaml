# Default controller + sensors shipped with the Husarion Panther description.
#
# `spawn_robot: {model: panther}` pulls these in automatically, so a world does not re-declare the
# robot's intrinsic kinematics/sensors.
components:
  # 4-wheel skid-steer, left pair and right pair commanded together -- the husky_a200 /
  # clearpath_jackal / rosbot class. Values are Husarion's own published controller config
  # (husarion_ugv_controller/config/WH01_controller.yaml) except slip_factor.
  - diff_drive:
      wheel_radius: 0.1825           # config/WH01.yaml, and the wheel cylinder matches it
      wheel_separation: 0.697        # WH01_controller.yaml, = the URDF geometry (2 x 0.3485)
      max_linear_vel: 2.0            # WH01_controller.yaml
      max_angular_vel: 4.0           # WH01_controller.yaml
      wheel_accel_limit: 2.7         # WH01_controller.yaml max linear acceleration
      # Skid-steer ICR slip compensation, calibrated against THIS model. Husarion publishes
      # wheel_separation_multiplier 1.5 for the same purpose on the real robot -- and the useful
      # finding is that the two numbers are NOT interchangeable. At 1.5 this base achieves only 0.40
      # of commanded yaw in MuJoCo, because point-contact scrub is far worse than a real tyre's.
      # Uncompensated it manages 0.26. chi=3.4 -> achieved/commanded 0.894/0.992/1.073/1.099 at
      # w = 0.3/0.5/0.8/1.0 rad/s. Re-measure if friction, actuator kv, mass or timestep change.
      slip_factor: 3.4
      left_actuators:  [fl_wheel_motor, rl_wheel_motor]
      right_actuators: [fr_wheel_motor, rr_wheel_motor]
      left_joints:  [fl_wheel_joint, rl_wheel_joint]
      right_joints: [fr_wheel_joint, rr_wheel_joint]
  # The scanner Husarion's own components configuration for this description names: an RPLIDAR S3
  # (component LDR06) on mount_link at xyz (0, -0.1, 0), rpy 0, named `second_lidar`
  # (husarion_ugv_description config/components.yaml:5-14 @ 559e784b, the file urdf/panther.urdf.xacro:26
  # loads by default). That file ships the entry commented out: Husarion includes no lidar with the
  # base platform and offers several (Panther options manual), so this is the sample, not a standard
  # fit. The alternatives are in the port log.
  #
  # Husarion's macro names the mount link and the scan frame after the component
  # (slamtec_rplidar.urdf.xacro:249-278 @ 5f783f8): `second_lidar_link` at the joint origin, declared
  # below, and `second_lidar_laser` 30.5 mm above it, turned half a revolution, which the device
  # publishes. The scan is the device's, as sllidar_ros2 publishes it, but for Husarion's range noise
  # and the topic.
  #
  # The scan frame is 0.202 m above body_link, 0.3845 m above the ground at the 0.1825 m wheel radius.
  - spawn_sensor:
      model: rplidar_s3
      parent_frame: second_lidar_link
      pos: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      frame_id: second_lidar_laser  # slamtec_rplidar.urdf.xacro:278, component name second_lidar
    name: second_lidar
    components:
      - lidar:
          # Husarion's value for the S3: its S3 block states std_dev 0.015 m
          # (slamtec_rplidar.urdf.xacro:48 @ 5f783f8), where the device takes the data sheet's
          # +-30 mm accuracy as 1 sigma.
          range_stddev: 0.015
          # Relative, so the robot's namespace scopes it: `<ns>/second_lidar/scan`
          # (slamtec_rplidar.urdf.xacro:286 @ 5f783f8).
          topics: {scan: second_lidar/scan}

# Fixed links Husarion's description chains and this MJCF flattens into body_link, down to the link
# the scanner hangs from.
frames:
  # husarion_ugv_description urdf/panther/base.urdf.xacro:87-91 @ 559e784b (body_to_cover_joint)
  - {name: cover_link, parent: body_link, pos: [0.0, 0.0, 0.14], rpy: [0.0, 0.0, 0.0]}
  # base.urdf.xacro:95-99 (cover_to_mount_joint)
  - {name: mount_link, parent: cover_link, pos: [0.0, 0.0, 0.0315], rpy: [0.0, 0.0, 0.0]}
  # config/components.yaml:10-14 @ 559e784b with slamtec_rplidar.urdf.xacro:249-253 @ 5f783f8: the
  # component's joint from mount_link to `second_lidar_link`, the S3's housing base.
  - {name: second_lidar_link, parent: mount_link, pos: [0.0, -0.1, 0.0], rpy: [0.0, 0.0, 0.0]}
