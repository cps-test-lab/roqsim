# Default controller + sensors for the Maker's Pet Mini (170 mm 3D-printed educational robot).
#
# `spawn_robot: {model: makerspet_mini}` pulls these in automatically, so a world does not re-declare
# the robot's intrinsic kinematics/sensors.
#
# NOTHING here is an assumption of ours: every value is the description's own, from urdf/params.xacro,
# urdf/plugins.xacro and config/navigation.yaml. That is unusual -- most mobile ports here have to
# invent at least a scanner mount height -- and it is the same property the OOMWOO vacuum has, from
# the same vendor.
components:
  # A TRUE two-wheel differential drive with a modelled caster -- so no slip_factor, the same line
  # turtlebot3_waffle, raspimouse and oomwoo_one draw. It does not turn by scrubbing.
  - diff_drive:
      wheel_radius: 0.0215           # params.xacro wheel_diameter 0.043
      wheel_separation: 0.105043     # params.xacro wheel_base, and the URDF geometry agrees
      max_linear_vel: 0.1            # config/navigation.yaml max_vel_x
      max_angular_vel: 0.5           # config/navigation.yaml max_vel_theta
      wheel_accel_limit: 1.0         # params.xacro max_linear_acceleration
      left_actuators:  [wheel_left_motor]
      right_actuators: [wheel_right_motor]
      left_joints:  [wheel_left_joint]
      right_joints: [wheel_right_joint]
  # The vendor's own scan, from plugins.xacro's laser_scan_sensor: 360 samples over a full turn,
  # 0.1-10 m, 5 Hz, stamped in base_scan. The mount is the description's scan_joint -- 0.0704 m above
  # base_link with the puck INVERTED (rpy 0 -pi 0), which is how this design fits a 360-degree scanner
  # under its head. The `lidar` site carries that rotation, so bearings are measured in base_scan as
  # the vendor's sensor measures them; the static TF hangs off base_link as scan_joint does.
  #
  # THE SCAN LOOKS OUT THROUGH A GAP UNDER THE HEAD. The rays skip only the scanner's own housing
  # (base_scan), never other robot geometry. The description's head encloses the scan plane (0.4 mm
  # into its collision cylinder); the real Mini carries its LiDAR in an open gap on four posts
  # (makerspet/store MINI-BDC30P-BODY print files). The model's head therefore ends at the puck's
  # bottom face, z 0.0624, collision and visual alike, with the head's mass and inertia unchanged, and
  # nothing of the robot is in the scan plane. A deviation from the description -- see the port log.
  - lidar:
      site: lidar
      frame_id: base_scan
      rays: 360
      angle_min: 0.0
      angle_max: 6.265732015         # 2*pi - 1 deg: the full turn, last ray one step short of 2*pi
      range_min: 0.1
      max_range: 10.0
      rate_hz: 5.0
      exclude_body: base_scan
      tf_parent: base_link
