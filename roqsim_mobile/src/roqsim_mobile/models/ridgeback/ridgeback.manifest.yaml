# Default controller + sensors shipped with the Clearpath Ridgeback description.
#
# `spawn_robot: {model: ridgeback}` pulls these in automatically.
components:
  # HOLONOMIC, and the only base in roqsim_mobile that is. Four mecanum wheels strafe, so this uses
  # omni_drive rather than diff_drive -- and therefore carries NO slip_factor, because the platform
  # does not turn by scrubbing. The rollers are not modelled; the commanded twist drives three
  # velocity actuators on the base free joint and the wheel servos keep the visuals and joint_states
  # honest. See the plugin's docstring.
  - omni_drive:
      base_joint: base_free
      vx_actuator: base_vx
      vy_actuator: base_vy
      wz_actuator: base_wz
      max_linear_vel: 1.1            # Clearpath's published translation speed
      max_lateral_vel: 1.1           # holonomic: the same sideways
      max_combined_linear_vel: 1.1   # cap on hypot(vx, vy)
      max_angular_vel: 2.0           # Clearpath's published yaw rate
      accel_limit: 1.0
      angular_accel_limit: 2.0
      # Mecanum wheel handling is OBSERVATIONAL -- it makes the wheels turn, and turn differently
      # when strafing. Geometry from the expanded xacro: wheel radius 0.0759, lateral separation
      # 2 x 0.2755, longitudinal 2 x 0.319.
      wheel_radius: 0.0759
      wheel_separation: 0.551
      axis_separation: 0.638
      wheels: [front_left_wheel, front_right_wheel, rear_left_wheel, rear_right_wheel]
      wheel_actuators: [front_left_wheel_motor, front_right_wheel_motor,
                        rear_left_wheel_motor, rear_right_wheel_motor]
  # The scanner Clearpath's default Ridgeback configuration mounts: one Hokuyo UST-10LX, forward, on
  # chassis_link (clearpath_config sample/r100/r100_default.yaml:13-17 @ b2a64ba; the UST-10LX is the
  # Ridgeback's standard forward lidar, user manual rev. 1.1.2 section 1.1). The platform description
  # carries no scanner of its own. The `hokuyo_ust` device hangs its bracket base at the joint origin
  # and stamps the scan in `lidar2d_0_laser`, 0.0474 m higher, so the scan plane is at z 0.2330 in
  # chassis_link. Clearpath's ROS 1 ridgeback_description put the same scanner's `front_laser` at
  # (0.3932, 0, 0.2330) (urdf/accessories/hokuyo_ust-10lx_mount.urdf.xacro, melodic-devel), 1 mm
  # further forward; the ROS 2 configuration is followed. Field, rays, range, rate and noise are the
  # device's UST-10LX specification values, not Clearpath's noise-free simulation.
  - spawn_sensor:
      model: hokuyo_ust
      parent_frame: chassis_link     # r100_default.yaml:15
      pos: [0.3922, 0.0, 0.1856]     # r100_default.yaml:16
      rpy: [0.0, 0.0, 0.0]           # no rpy in r100_default.yaml: Accessory default (0, 0, 0)
      frame_id: lidar2d_0_laser      # clearpath_config sensors/types/lidars_2d.py get_frame_id_from_idx
    name: lidar2d_0
    components:
      - lidar:
          # Relative, so the robot's namespace scopes it: `<ns>/sensors/lidar2d_0/scan`
          # (clearpath_sensors_description hokuyo_ust.urdf.xacro:52 @ b0f6d92; clearpath_config
          # sensors/types/sensor.py get_topic_name).
          topics: {scan: sensors/lidar2d_0/scan}
