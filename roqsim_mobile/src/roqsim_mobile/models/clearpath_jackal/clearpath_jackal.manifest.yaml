# Default controller + sensors shipped with the Clearpath Jackal robot description.
#
# `spawn_robot: {model: clearpath_jackal}` pulls these in automatically, so a world does not
# re-declare the robot's intrinsic kinematics/sensors. To override a default, nest an entry with the
# same LABEL under that spawn_robot's `components:` (it merges into this one, per key); to opt out
# entirely, set `spawn_robot` config `default_plugins: false`. Each entry below attaches to the
# spawned entity because it is nested under it -- there is no ownership key to fill in.
components:
  # Skid-steer: all four wheels driven, left pair and right pair commanded together.
  - diff_drive:
      wheel_radius: 0.098            # jackal_description
      wheel_separation: 0.37559      # track
      # Kinematic limits. The paper (SIMPAR 2025) states NONE -- see spec gap g_kinematic_limits.
      # 1.0 m/s is the gap's documented workaround (the Jackal's 2.0 m/s datasheet top speed is an
      # outdoor figure, and the paper's own distance/time columns back-compute to ~0.44 m/s mean).
      # Whatever Nav2 is given must equal these, or the model and the stack saturate differently.
      max_linear_vel: 1.0
      max_angular_vel: 1.0
      wheel_accel_limit: 1.0
      # Skid-steer ICR slip compensation, calibrated against THIS model's friction/mass/timestep.
      # chi inflates the yaw term of the wheel command and is divided back out of odometry.
      # Measured achieved/commanded yaw at chi=1.7: 0.92 / 0.98 / 1.02 / 1.02 at
      # w = 0.3 / 0.5 / 0.8 / 1.0 rad/s. Re-measure if wheel friction, actuator kv/armature,
      # mass or timestep change -- test_jackal_scene.py::test_b2_in_place_rotation asserts it.
      slip_factor: 1.7
      left_actuators:  [front_left_wheel_motor,  rear_left_wheel_motor]
      right_actuators: [front_right_wheel_motor, rear_right_wheel_motor]
      left_joints:  [front_left_wheel_joint,  rear_left_wheel_joint]
      right_joints: [front_right_wheel_joint, rear_right_wheel_joint]
  # Velodyne VLP-16 on the vendor's tower, cast as a PLANAR scan at the sensor's own scan height: what
  # a 2D costmap receives after pointcloud_to_laserscan (spec gaps g_lidar_params and
  # g_scan_projection; port log A5 says when a true 16-plane model would be needed instead).
  # The mount is jackal_description's vlp16_mount (accessories/vlp16_mount.urdf.xacro @ 4ddf9b5): the
  # tower's plate joint at height 0.1 on mid_mount, the VLP-16 at the plate origin. Clearpath's ROS 2
  # sample puts `velodyne_lidar` at the same place, xyz (0, 0, 0.1) on default_mount (clearpath_config
  # sample/j100/j100_sample.yaml:64-70 @ b2a64ba). The device stamps the scan 0.0377 m above its base:
  # 0.184 + 0.1 + 0.0377 = 0.3217 in base_link, 0.3852 m above the ground.
  # The scan frame is `velodyne`: vlp16_mount calls the VLP-16 macro without a name, and the macro's
  # default is `velodyne` (velodyne_description urdf/VLP-16.urdf.xacro); Clearpath's ROS 2
  # configuration calls the same frame `lidar3d_0_laser`.
  - spawn_sensor:
      model: velodyne_vlp16
      parent_frame: mid_mount
      pos: [0.0, 0.0, 0.1]          # vlp16_mount.urdf.xacro tower height 0.1 @ 4ddf9b5
      rpy: [0.0, 0.0, 0.0]
      frame_id: velodyne            # VLP-16.urdf.xacro default name, called without one by vlp16_mount
    name: velodyne
    # No override: the scan is the device's, as the VLP-16 driver publishes it. Clearpath's own driver
    # configuration for the sensor (clearpath_robot clearpath_sensors/config/velodyne_lidar.yaml,
    # branch jazzy: min_range 0.9, max_range 130.0, rpm 600.0, laserscan resolution 0.007, ring -1)
    # sets the values the device already carries. An experiment whose paper states other values
    # overrides them in its own world.

# Fixed links the vendor chains and this MJCF flattens into base_link, which a device hangs from.
frames:
  # jackal_description urdf/jackal.urdf.xacro `mid_mount` @ 4ddf9b5, the chassis top; Clearpath's ROS 2
  # `default_mount` is the same link (j100.urdf.xacro:125-129 @ b0f6d92).
  - {name: mid_mount, parent: base_link, pos: [0.0, 0.0, 0.184], rpy: [0.0, 0.0, 0.0]}
