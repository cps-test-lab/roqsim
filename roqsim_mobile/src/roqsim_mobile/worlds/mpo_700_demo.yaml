# Neobotix MPO-700 in an empty room — standalone demo world (roqsim_mobile).
#
# Standalone:  roqsim sim roqsim_mobile:mpo_700_demo
# For ROS 2 / nav2, see the roqsim_ros_bridge and roqsim_nav2_example packages.

sim:
  pacing: realtime

components:
  # omni_drive with SWERVE inverse kinematics (four steered wheels, no slip_factor) and the vendor's
  # two SICK S300 scanners come from the mpo_700 model manifest.
  - spawn_robot:
      model: mpo_700
      pos: [0.0, 0.0]
      yaw: 0.0
    name: robot

    components:
      # A strafing arc, so the wheels visibly aim: the point of a swerve base, and something no
      # other model here does.
      - omni_drive:
          test_cmd: [0.4, 0.3, 0.2]   # [vx, vy, wz]; remove once the ros2_bridge drives /cmd_vel
