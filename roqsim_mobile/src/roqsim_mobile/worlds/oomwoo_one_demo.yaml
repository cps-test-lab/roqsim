# OOMWOO One robot vacuum in an empty room — standalone demo world (roqsim_mobile).
#
# Standalone:  roqsim sim roqsim_mobile:oomwoo_one_demo
# For ROS 2 / nav2, see the roqsim_ros_bridge and roqsim_nav2_example packages.

sim:
  pacing: realtime

components:
  # diff_drive (a true 2-wheel differential drive with a caster, so no slip_factor) and the lidar
  # come from the oomwoo_one model manifest. Everything in it is the vendor's own number.
  - spawn_robot:
      model: oomwoo_one
      pos: [0.0, 0.0]
      yaw: 0.0
    name: robot

    components:
      - diff_drive:
          # The vendor's own Nav2 limits are 0.2 m/s and 0.8 rad/s, so this is a slow 0.6 m circle
          # — a vacuum's pace, and a reminder that this is a 0.35 m robot in a 10 m room.
          test_cmd: [0.15, 0.25]   # remove once the ros2_bridge drives /cmd_vel
