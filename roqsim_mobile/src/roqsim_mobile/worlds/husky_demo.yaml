# Clearpath Husky A200 in an empty room — standalone demo world (roqsim_mobile).
#
# Standalone:  roqsim sim roqsim_mobile:husky_demo
# A `test_cmd` drives the robot in a circle so the standalone scene shows motion.
# For ROS 2 / nav2, see the roqsim_ros_bridge and roqsim_nav2_example packages.

sim:
  pacing: realtime      # realtime | asap | {factor: N}

components:
  # diff_drive (skid-steer, 4 driven wheels + slip_factor) and the 360 deg / 30 Hz lidar come from
  # the husky_a200 model manifest (models/husky_a200/husky_a200.manifest.yaml).
  - spawn_robot:
      model: husky_a200
      pos: [0.0, 0.0]
      yaw: 0.0
    name: robot

  # Override the manifest's diff_drive only to add test_cmd: with no ROS to send /cmd_vel, this
  # scripted [v, w] drives the robot in a circle so the standalone scene shows motion.
  # Limits are the paper's Nav2 limits (1.0 m/s, 1.0 rad/s), so this is well inside them.
    components:
      - diff_drive:
          test_cmd: [0.5, 0.4]   # remove once the ros2_bridge drives /cmd_vel

  # For ROS 2 (separate colcon package roqsim_ros_bridge): one bridge reads every declared endpoint
  # from ctx.interface -- no per-topic config needed. For >1 robot, set `namespace: <name>` on each
  # spawn_robot; its endpoints (topics/frames) then live under /<name>/... automatically.
  # - ros2_bridge: {}
