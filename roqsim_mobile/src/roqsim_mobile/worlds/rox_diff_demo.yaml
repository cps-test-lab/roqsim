# Neobotix ROX-Diff in an empty room — standalone demo world (roqsim_mobile).
#
# Standalone:  roqsim sim roqsim_mobile:rox_diff_demo
# For ROS 2 / nav2, see the roqsim_ros_bridge and roqsim_nav2_example packages.

sim:
  pacing: realtime

components:
  # diff_drive (a true 2-wheel differential drive with passive casters, so no slip_factor) and the
  # vendor's two SICK nanoScan3 scanners come from the rox_diff model manifest.
  - spawn_robot:
      model: rox_diff
      pose:
        position:    {x: 0.0, y: 0.0}
        orientation: {yaw: 0.0}
    name: robot

    components:
      - diff_drive:
          test_cmd: [0.5, 0.4]   # remove once the ros2_bridge drives /cmd_vel
