# Maker's Pet Loki in an empty room — standalone demo world (roqsim_mobile).
#
# Standalone:  roqsim sim roqsim_mobile:makerspet_loki_demo
# For ROS 2 / nav2, see the roqsim_ros_bridge and roqsim_nav2_example packages.

sim:
  pacing: realtime

components:
  # diff_drive (a true 2-wheel differential drive with a caster, so no slip_factor) and the lidar
  # come from the makerspet_loki model manifest.
  - spawn_robot:
      model: makerspet_loki
      pos: [0.0, 0.0]
      yaw: 0.0
    name: robot

    components:
      - diff_drive:
          # A ~0.9 m circle at the vendor's own 0.26 m/s. This is a 200 mm robot in a 10 m room.
          test_cmd: [0.22, 0.25]   # remove once the ros2_bridge drives /cmd_vel
