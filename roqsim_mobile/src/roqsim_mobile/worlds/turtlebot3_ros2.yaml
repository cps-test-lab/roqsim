# TurtleBot3 Waffle in an empty room — standalone demo world (roqsim_mobile).
#
# Standalone:  roqsim sim roqsim_mobile:turtlebot3_ros2
# Hand-drive:  roqsim sim roqsim_mobile:turtlebot3_ros2 --manual-control
# A `test_cmd` drives the robot in a circle so the standalone scene shows motion.
# For ROS 2 / nav2, see the roqsim_ros_bridge and roqsim_nav2_example packages.

sim:
  pacing: realtime      # realtime | asap | {factor: N}

plugins:
  # diff_drive + lidar come from the model manifest (models/turtlebot3_waffle/turtlebot3_waffle.manifest.yaml), which
  # carries the platform's datasheet limits (0.26 m/s, 1.82 rad/s) and its stock LDS-01 scanner.
  - spawn_robot:
      model: turtlebot3_waffle
      name: robot
      pos: [0.0, 0.0]
      yaw: 0.0

  # Override the manifest's diff_drive only to add test_cmd: with no ROS to send /cmd_vel, this
  # scripted [v, w] drives the robot in a circle so the standalone scene shows motion. The values are
  # scaled to this platform — it tops out at 0.26 m/s, a quarter of the Husky's.
  - diff_drive:
      robot: robot
      test_cmd: [0.12, 0.4]   # remove once the ros2_bridge drives /cmd_vel

  # For ROS 2 (separate colcon package roqsim_ros_bridge): one bridge reads every declared endpoint
  # from ctx.interface -- no per-topic config needed. For >1 robot, set `namespace: <name>` on each
  # spawn_robot; its endpoints (topics/frames) then live under /<name>/... automatically.
  # - ros2_bridge: {}
