[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roqsim"
version = "0.1.0"
description = "A lightweight, plugin-driven MuJoCo simulation framework (core)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "click>=8.1",   # the `roqsim` command tree (roqsim/commands.py); tools keep their own argparse
    # `roqsim render` writes its stills through Pillow, so it is a hard dependency of a shipped
    # subcommand, not an optional extra. Two other sites (the splash overlay, the web exporter's
    # texture downscale) degrade without it; the renderer cannot.
    "pillow>=9.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

# Built-in core plugins. Robot-family plugins live in sibling packages (e.g. roqsim_mobile).
[project.entry-points."roqsim.plugins"]
dummy = "roqsim.plugins.dummy:DummyPlugin"
spawn_model = "roqsim.plugins.spawn_model:SpawnModelPlugin"
ceiling = "roqsim.plugins.ceiling:CeilingPlugin"
contact_monitor = "roqsim.plugins.contact_monitor:ContactMonitorPlugin"
# WHERE it is being touched, right now, rather than whether it ever was. A separate plugin because
# it is a different question with a different lifetime: contact_monitor LATCHES the first contact
# (a failed trial is not un-failed), while a tactile reading is only useful while it is current and
# is replaced every step. This is what a bumper-driven or tactile controller reads in its loop.
contact_location = "roqsim.plugins.contact_location:ContactLocationPlugin"
# The friction of ONE pair, which per-geom values cannot express: MuJoCo combines them by MAX, so a
# geom's friction is a floor on every contact it takes part in. Two different pair frictions sharing
# one object -- a box sliding on a floor while a robot pushes it -- need an explicit <pair>.
contact_pair_override = "roqsim.plugins.contact_pair_override:ContactPairOverridePlugin"
# The gradient beside that verdict: contact_monitor says whether it touched, this says how
# close it came. Same geometry, one owner each.
clearance_monitor = "roqsim.plugins.clearance_monitor:ClearanceMonitorPlugin"
# The write side of the same coin: contact_monitor REPORTS contacts, this CHANGES named model values
# (friction, contact masks, actuator force limits, mass) mid-run on an external trigger, then restores
# them exactly. Curated allowlist -- fields MuJoCo cannot take at runtime are refused by name.
model_override = "roqsim.plugins.model_override:ModelOverridePlugin"
# Carried mass on any robot's body -- a load, not a robot family, so it is core beside the other
# world-agnostic plugins.
payload = "roqsim.plugins.payload:PayloadPlugin"
# What the run COST, beside what it did: mechanical power off the actuators, integrated. Core rather
# than a robot family because every actuated thing has the question, and the measured part
# (force * velocity) is the same for a wheel, a joint and a rotor.
energy_monitor = "roqsim.plugins.energy_monitor:EnergyMonitorPlugin"

# Ground that is not flat. Everything this substrate could stand a robot on was a plane, while four
# of its ported platforms are outdoor machines whose papers are about what happens when it is not.
heightfield = "roqsim.plugins.heightfield:HeightfieldPlugin"

[project.scripts]
# `roqsim` is the command tree; the simulator is `roqsim sim`. The roqsim-export-* names stay as aliases of
# `roqsim export *` because they are already written into other people's configs and scripts.
roqsim = "roqsim.commands:main"
roqsim-export-web = "roqsim.export_web:main"
roqsim-export-urdf = "roqsim.export_urdf:main"
roqsim-export-srdf = "roqsim.export_srdf:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roqsim = ["assets/*.png", "assets/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
